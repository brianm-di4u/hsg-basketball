const say = (m, k, o = {}) => { m.ev.push({ k, ...o }); if (m.ev.length > 60) m.ev.shift(); };
function log(m, s) { m.log.push(`Q${m.clock.q} ${m.clock.t.toFixed(1)} ${s}`); if (m.log.length > 50) m.log.shift(); }

// ---------------------------------------------------------------- phase setups
function place(m, i, x, z) { const p = m.p[i]; p.x = p.tx = x; p.z = p.tz = z; p.vx = p.vz = 0; p.y = 0; p.vy = 0; p.act = 'idle'; p.drive = 0; }

function setupTipoff(m) {
  m.phase = 'tipoff'; m.phaseT = 0; m.clock.running = false;
  for (let t = 0; t < 2; t++) {
    const d = m.dir[t];
    const sp = [[47 - d * 10, 25], [47 - d * 4, 14], [47 - d * 4, 36], [47 + d * 3, 16], [47 - d * 1.6, 25]];
    for (let s = 0; s < 5; s++) place(m, t * 5 + s, sp[s][0], sp[s][1]);
  }
  Object.assign(m.ball, { x: 47, y: 5, z: 25, vx: 0, vy: 0, vz: 0, state: 'dead', holder: -1 });
  m.tip = { userT: -1, done: false };
}

function setupInbound(m, team, kind, x = 47) {
  if (kind !== 'base') doSubs(m);
  const d = m.dir[team];
  let ix, iz;
  if (kind === 'base') { ix = d > 0 ? -1.5 : COURT.L + 1.5; iz = 19; }
  else { ix = clamp(x, 12, COURT.L - 12); iz = COURT.W + 1.6; }
  const by = team * 5 + (kind === 'base' ? 3 : 2);
  const recv = team * 5;
  m.inb = { team, kind, x: ix, z: iz, by, recv, t: 0, ready: false };
  for (const q of m.p) if (q.act === 'shoot' || q.act === 'layup') { q.act = 'idle'; q.meter = 0; }
  m.phase = 'inbound'; m.phaseT = 0;
  setPoss(m, team);
  m.ball.state = 'held'; m.ball.holder = by; m.ball.passTo = -1;
  if (kind !== 'base') {
    m.clock.running = false;
    // dead ball: everyone resets to shape around the ball
    const sp = spots(d);
    for (let s = 0; s < 5; s++) {
      const i = team * 5 + s;
      if (i === by) continue;
      const tx = clamp(ix + (sp[s][0] - 47) * 0.45 + d * 4, 3, COURT.L - 3);
      place(m, i, tx, clamp(sp[s][1] + 4, 4, 46));
    }
    for (let s = 0; s < 5; s++) {
      const i = (1 - team) * 5 + s, man = m.p[team * 5 + s];
      place(m, i, man.x + d * 3, man.z - 1.5);
    }
    place(m, by, ix, iz);
    m.inb.ready = true;
  } else {
    m.p[by].tx = ix; m.p[by].tz = iz;
  }
}

function setupFT(m, shooter, n) {
  doSubs(m, shooter);
  const p = m.p[shooter], t = p.t, d = m.dir[t];
  m.phase = 'ft'; m.phaseT = 0; m.clock.running = false;
  m.ft = { by: shooter, team: t, left: n, total: n, made: 0, mv: 0, md: 1, state: 'aim', t: 0, label: null };
  const rx = rimFor(d);
  place(m, shooter, rx - d * (COURT.ftDist + 0.6), 25); p.face = d;
  const lane = [[4, 18], [4, 32], [7.5, 18], [7.5, 32], [11, 18], [11, 32]];
  let li = 0;
  for (let k = 0; k < 10; k++) {
    if (k === shooter) continue;
    const q = m.p[k];
    if (li < 6 && (q.slot >= 2 || li < 2)) { place(m, k, rx - d * lane[li][0], lane[li][1] + (lane[li][1] < 25 ? -1.4 : 1.4)); li++; }
    else place(m, k, rx - d * 24, q.t === t ? 14 + q.slot * 4 : 16 + q.slot * 4);
    m.p[k].face = d;
  }
  setPoss(m, t);
  Object.assign(m.ball, { state: 'held', holder: shooter, passTo: -1 });
}

function setPoss(m, t) {
  if (m.poss !== t || m.possAt === 0) { m.poss = t; m.possAt = m.time; resetShot(m); m.help = [-1, -1]; for (const p of m.p) { p.drive = 0; p.cut = 0; } }
}
function resetShot(m) {
  m.clock.shot = m.rules.shotClock;
  m.clock.shotOff = !m.rules.shotClock || m.clock.t < m.rules.shotClock;
}

function toQEnd(m) {
  m.buzzerPending = false; m.clock.running = false; m.pend = null;
  const [a, b] = [m.teams[0].score, m.teams[1].score];
  if (m.clock.q >= 4 && a !== b) {
    m.phase = 'final'; m.phaseT = 0; m.winner = a > b ? 0 : 1;
    for (const p of m.p) { p.act = p.t === m.winner ? 'celebrate' : 'idle'; p.actT = 0; }
    say(m, 'final', { winner: m.winner }); log(m, `FINAL ${a}-${b}`);
    m.ball.state = 'dead'; m.ball.holder = -1;
    return;
  }
  m.phase = 'qend'; m.phaseT = 0; m.breakReady = false;
  say(m, 'qend', { q: m.clock.q });
}

function startNextPeriod(m) {
  if (m.phase !== 'qend') return;
  m.clock.q++;
  if (m.clock.q === 3) m.dir = [-m.dir[0], -m.dir[1]];
  m.clock.t = m.clock.q <= 4 ? m.rules.qLen : m.rules.otLen;
  for (const T of m.teams) for (const r of T.roster) r.energy = Math.min(1, r.energy + (m.clock.q === 3 ? 0.5 : 0.25));
  const team = m.arrow; m.arrow = 1 - team;
  m.possAt = 0; // force a fresh possession
  setupInbound(m, team, 'side', 47);
  m.breakReady = false;
  say(m, 'period', { q: m.clock.q });
}

// ---------------------------------------------------------------- substitutions
function doSubs(m, keep = -1) {
  for (let t = 0; t < 2; t++) {
    const T = m.teams[t];
    for (let s = 0; s < 5; s++) {
      if (t * 5 + s === keep) continue;
      const cur = T.roster[T.onCourt[s]];
      if (!cur.out && cur.energy > 0.55) continue;
      let best = -1, bs = -1;
      for (let r = 0; r < T.roster.length; r++) {
        if (T.onCourt.includes(r)) continue;
        const c = T.roster[r];
        if (c.out || c.energy < 0.72) continue;
        const sc = c.ovr + (c.pos === cur.pos ? 12 : 0) + c.energy * 10;
        if (sc > bs) { bs = sc; best = r; }
      }
      if (best >= 0) {
        T.onCourt[s] = best; m.p[t * 5 + s].r = best;
        say(m, 'sub', { t, num: T.roster[best].num }); log(m, `${T.abbr} sub #${T.roster[best].num} for #${cur.num}`);
      }
    }
  }
}

// ---------------------------------------------------------------- actions (used by AI and the user)
function startShot(m, i) {
  const p = m.p[i];
  if (m.ball.holder !== i || p.act === 'shoot' || p.act === 'layup') return false;
  if (m.phase !== 'live') return false;
  const d = m.dir[p.t];
  const dist = distToRim(p.x, p.z, d);
  const r = R(m, i);
  const reachIn = r.height + (r.jmp * 14);
  p.stype = dist < 4.6 ? (reachIn >= 86 && Math.hypot(p.vx, p.vz) > 6 ? 'dunk' : 'layup') : 'jumper';
  p.act = p.stype === 'jumper' ? 'shoot' : 'layup';
  p.actT = 0; p.meter = 0;
  if (p.stype === 'jumper') { p.vy = 10 + 4 * r.jmp; p.vx *= 0.2; p.vz *= 0.2; }
  else p.vy = 11 + 4 * r.jmp;
  const ai = aiOf(m, p.t);
  if (!(m.user.team === p.t && m.user.ctrl === i && !m.user.auto)) {
    const sd = ai.sd * (1.25 - 0.5 * (p.stype === 'jumper' ? r.sht : r.ins));
    p.relAt = clamp(SWEET + gauss(m) * sd, 0.45, 1.12);
  } else p.relAt = 99;
  say(m, 'gather', { i });
  // AI defenders react with a contest jump
  for (let k = (1 - p.t) * 5; k < (1 - p.t) * 5 + 5; k++) {
    const q = m.p[k];
    if (Math.hypot(q.x - p.x, q.z - p.z) < 4.5 && q.y === 0) q.jumpIn = aiOf(m, q.t).react + rnd(m) * 0.12;
  }
  return true;
}

function release(m, i) {
  const p = m.p[i], t = p.t, d = m.dir[t], r = R(m, i);
  const T = m.teams[t];
  const type = p.stype;
  const mt = meterTime(type === 'jumper' ? 'jumper' : 'layup');
  const v = p.actT / mt;
  const userShot = m.user.team === t && m.user.ctrl === i && !m.user.auto;
  let scale = userShot ? (DIFF[m.difficulty] || DIFF[1]).win * (m.assist ? 1.5 : 1) : 1;
  if (userShot && m.crowdTeam === t && m.crowd > 0.6) scale *= 1.3;
  const mq = meterQuality(v, scale, type === 'jumper' ? 'jumper' : 'layup');
  if (userShot) { m.user.meterLabel = mq.label; m.user.meterLabelT = 1.2; }
  const forced = p.forceQ;
  const quality = forced != null ? forced : mq.q;
  if (forced != null) { mq.label = forced >= 1 ? 'PERFECT' : forced >= 0.75 ? 'GOOD' : 'EARLY'; if (userShot) m.user.meterLabel = mq.label; }
  p.forceQ = null;
  const dist = distToRim(p.x, p.z, d);
  const three = type === 'jumper' && isThree(p.x, p.z, d);
  const nd = nearestDef(m, p.x, p.z, t);
  const jumping = nd.idx >= 0 && m.p[nd.idx].y > 0.5;
  const contest = contestFactor(nd.d, jumping);
  const bonus = m.crowdTeam === t && m.crowd > 0.6 ? 1.05 : 1;
  const prob = shotChance({ dist, type, sht: r.sht, ins: r.ins, contest, quality, energy: r.energy, bonus });
  const make = rnd(m) < prob;
  let foul = null;
  if (!m.noFouls && nd.idx >= 0 && nd.d < 3.2) {
    const pf = 0.04 + (nd.d < 2 ? 0.05 : 0) + (jumping ? 0.04 : 0);
    if (rnd(m) < pf) foul = { by: nd.idx, fts: three ? 3 : 2 };
  }
  // trajectory
  const x0 = p.x + d * 0.5, z0 = p.z, y0 = hFt(m, i) + p.y + 0.7;
  const rx = rimFor(d), rz = COURT.rimZ;
  let tx = rx, tz = rz, ty = COURT.rimY, airball = false;
  if (!make) {
    if (quality < 0.12 && dist > 12) { airball = true; tx = rx - d * 2.2; ty = 8.2; }
    else {
      const ang = Math.atan2(rz - z0, rx - x0) + (rnd(m) - 0.5) * 1.4;
      const off = rnd(m) < 0.55 ? -1 : 1; // front or back rim
      tx = rx + Math.cos(ang) * 0.8 * off; tz = rz + Math.sin(ang) * 0.8 * off; ty = 10.15;
    }
  }
  const Tf = type === 'dunk' ? 0.22 : type === 'layup' ? 0.5 : 0.72 + dist * 0.021;
  Object.assign(m.ball, {
    state: 'shot', holder: -1, x: x0, y: y0, z: z0, lastTouch: t, tried: [],
    vx: (tx - x0) / Tf, vz: (tz - z0) / Tf, vy: (ty - y0 + 0.5 * G * Tf * Tf) / Tf,
    shot: { by: i, team: t, type, three, make, airball, T: Tf, t: 0, x0, y0, z0, foul, q: quality, label: mq.label, buzzer: m.clock.t <= 0, pts: three ? 3 : 2, prob },
  });
  m.ball.land = null;
  r.st.fga++; if (three) r.st.tpa++;
  say(m, 'shot', { i, three, type });
  p.holdT = 0;
}

function doPass(m, i, j) {
  const p = m.p[i], q = m.p[j];
  if (m.ball.holder !== i || i === j) return false;
  if (p.act === 'shoot' || p.act === 'layup') return false;
  const dd = Math.hypot(q.x - p.x, q.z - p.z);
  const Tp = clamp(dd / 38, 0.18, 1.0);
  const lx = clamp(q.x + q.vx * Tp * 0.6, 0.5, COURT.L - 0.5), lz = clamp(q.z + q.vz * Tp * 0.6, 0.5, COURT.W - 0.5);
  Object.assign(m.ball, {
    state: 'pass', holder: -1, passTo: j, lastTouch: p.t, lastPasser: i, passAt: m.time, tried: [],
    px0: m.ball.x, py0: m.ball.y, pz0: m.ball.z, px1: lx, pz1: lz, pt: 0, pT: Tp, inb: m.phase === 'inbound',
  });
  q.tx = lx; q.tz = lz;
  p.act = 'pass'; p.actT = 0; p.holdT = 0; p.drive = 0;
  say(m, 'pass', { i, j });
  return true;
}

function trySteal(m, i) {
  const p = m.p[i];
  if (p.cool > 0 || m.phase !== 'live') return false;
  p.cool = 0.8; p.act = 'steal'; p.actT = 0;
  const h = m.ball.holder;
  if (h < 0 || m.p[h].t === p.t) return false;
  const hp = m.p[h];
  if (Math.hypot(hp.x - p.x, hp.z - p.z) > 3.6 || hp.act === 'shoot' || hp.act === 'layup') return false;
  const rs = R(m, i), rh = R(m, h);
  const chance = clamp(0.1 + 0.32 * (rs.def - rh.hnd * 0.7), 0.04, 0.38);
  const roll = rnd(m);
  if (roll < chance) {
    rs.st.stl++; rh.st.to++;
    gainBall(m, i, 'steal');
    say(m, 'steal', { i }); log(m, `${m.teams[p.t].abbr} steal #${rs.num}`);
    return true;
  }
  if (!m.noFouls && roll > 1 - 0.1) { foulCall(m, i, h, 'reach'); }
  return false;
}

function jump(m, i) {
  const p = m.p[i];
  if (p.y > 0 || p.act === 'shoot' || p.act === 'layup') return false;
  p.vy = 12 + 4 * R(m, i).jmp; p.act = 'jump'; p.actT = 0;
  return true;
}

const A = { startShot, doPass, trySteal, jump };

function gainBall(m, i, how) {
  const p = m.p[i];
  const prev = m.ball.lastTouch;
  Object.assign(m.ball, { state: 'held', holder: i, passTo: -1, lastTouch: p.t, land: null });
  p.holdT = 0; p.drive = 0;
  if (p.act === 'shoot' || p.act === 'layup') { p.act = 'idle'; p.meter = 0; }
  if (how === 'reb') { R(m, i).st.reb++; say(m, 'reb', { i }); }
  if (m.poss !== p.t) setPoss(m, p.t);
  if (how === 'catch' && m.phase === 'inbound') { m.phase = 'live'; m.phaseT = 0; m.clock.running = m.clock.t > 0; m.inb = null; }
  if (how !== 'catch' && m.phase === 'live' && prev !== p.t) m.run.lastChange = m.time;
}

// ---------------------------------------------------------------- fouls and scoring
function foulCall(m, defIdx, offIdx, kind) {
  const d = m.p[defIdx], T = m.teams[d.t];
  const rd = R(m, defIdx);
  rd.st.pf++;
  const qi = Math.min(m.clock.q, 4) - 1;
  T.tf[qi]++;
  if (rd.st.pf >= m.rules.foulOut) { rd.out = true; say(m, 'fouledout', { t: d.t, num: rd.num }); log(m, `${T.abbr} #${rd.num} fouls out`); }
  say(m, 'whistle', { why: kind, i: defIdx }); log(m, `foul ${T.abbr} #${rd.num} (${kind})`);
  if (kind === 'reach') {
    m.clock.running = false;
    const offTeam = m.p[offIdx].t;
    if (T.tf[qi] >= m.rules.bonusAt) { m.pend = { k: 'ft', i: offIdx, n: 2, delay: 0.8 }; m.ball.state = 'dead'; m.ball.holder = -1; m.phase = 'dead'; }
    else { m.pend = { k: 'inbound', team: offTeam, kind: 'side', x: m.p[offIdx].x, delay: 0.8 }; m.ball.state = 'dead'; m.ball.holder = -1; m.phase = 'dead'; }
  }
}

function score(m, t, pts, shooterIdx) {
  m.teams[t].score += pts;
  const r = R(m, shooterIdx);
  r.st.pts += pts;
  if (m.run.team === t) m.run.pts += pts; else m.run = { team: t, pts };
  if (m.crowdTeam >= 0) m.crowd = clamp(m.crowd + (m.crowdTeam === t ? pts * 0.07 : -pts * 0.04), 0, 1);
  say(m, 'score', { t, pts, i: shooterIdx });
  log(m, `${m.teams[t].abbr} +${pts} #${r.num} (${m.teams[0].score}-${m.teams[1].score})`);
}

// ---------------------------------------------------------------- main tick
function tick(m) {
  m.time += DT; m.phaseT += DT;
  const inp = m.input;
  if (m.phase === 'final') { animate(m); clearEdges(inp); return; }
  if (m.phase === 'qend') {
    animate(m); integrate(m);
    if (m.phaseT > 1.6) { m.breakReady = true; if (m.autoBreak) startNextPeriod(m); }
    clearEdges(inp); return;
  }
  if (m.pend) {
    m.pend.delay -= DT;
    if (m.pend.delay <= 0) {
      const pd = m.pend; m.pend = null;
      if (pd.k === 'inbound') setupInbound(m, pd.team, pd.kind, pd.x);
      else if (pd.k === 'ft') setupFT(m, pd.i, pd.n);
      else if (pd.k === 'qend') toQEnd(m);
      else if (pd.k === 'ftnext' && m.ft) {
        const ft = m.ft;
        ft.state = 'aim'; ft.t = 0; ft.label = null;
        Object.assign(m.ball, { state: 'held', holder: ft.by });
        m.p[ft.by].act = 'idle';
      }
    }
  }
  if (m.phase === 'tipoff') tipoffTick(m);
  controlTick(m);
  for (let i = 0; i < 10; i++) {
    const p = m.p[i];
    p.cool = Math.max(0, p.cool - DT);
    p.holdT += DT;
    if (p.drive > 0) p.drive -= DT;
    if (isUserCtrl(m, i)) continue;
    if (p.drive > 0 && m.ball.holder === i && distToRim(p.x, p.z, m.dir[p.t]) < 4.2) startShot(m, i);
    p.aiT -= DT;
    if (p.aiT <= 0) decide(m, i, A, aiOf(m, p.t));
    if (p.jumpIn != null) { p.jumpIn -= DT; if (p.jumpIn <= 0) { p.jumpIn = null; if (m.ball.state === 'shot' || (m.ball.holder >= 0 && (m.p[m.ball.holder].act === 'shoot' || m.p[m.ball.holder].act === 'layup'))) jump(m, i); } }
  }
  shooterTick(m);
  if (m.phase === 'inbound') inboundTick(m);
  if (m.phase === 'ft') ftTick(m);
  integrate(m);
  ballTick(m);
  clockTick(m);
  animate(m);
  if (m.user.meterLabelT > 0) m.user.meterLabelT -= DT;
  clearEdges(inp);
}
function clearEdges(inp) { inp.shootP = inp.shootR = inp.passP = inp.switchP = false; }

const isUserCtrl = (m, i) => m.user.team >= 0 && !m.user.auto && m.user.ctrl === i;

function tipoffTick(m) {
  const t = m.phaseT;
  m.ball.x = 47; m.ball.z = 25; m.ball.y = 5.5 + 18 * t - 16 * t * t; // peak ~10.5 ft at 0.56 s
  const ut = m.user.team;
  const c0 = 4, c1 = 9;
  if (ut >= 0 && !m.user.auto && m.input.shootP && m.tip.userT < 0) { m.tip.userT = t; jump(m, ut * 5 + 4); }
  if (t > 0.3 && m.p[c0].y === 0 && !(ut === 0 && !m.user.auto)) jump(m, c0);
  if (t > 0.32 && m.p[c1].y === 0 && !(ut === 1 && !m.user.auto)) jump(m, c1);
  if (t >= 0.62 && !m.tip.done) {
    m.tip.done = true;
    let p0 = 0.5 + (R(m, c0).jmp + R(m, c0).height / 100 - R(m, c1).jmp - R(m, c1).height / 100) * 0.6;
    if (ut >= 0 && !m.user.auto) {
      const good = m.tip.userT >= 0.3 && m.tip.userT <= 0.6;
      const adj = m.tip.userT < 0 ? -0.15 : good ? 0.25 : -0.1;
      p0 += ut === 0 ? adj : -adj;
    }
    const win = rnd(m) < clamp(p0, 0.1, 0.9) ? 0 : 1;
    m.arrow = 1 - win;
    m.phase = 'live'; m.phaseT = 0; m.clock.running = true;
    m.ball.y = 10; m.ball.holder = win * 5 + 4;
    m.ball.state = 'held';
    m.possAt = 0; setPoss(m, win);
    doPass(m, win * 5 + 4, win * 5 + 0);
    say(m, 'tip', { t: win }); log(m, `tip won by ${m.teams[win].abbr}`);
  }
}

function controlTick(m) {
  const u = m.user, ut = u.team;
  if (ut < 0 || u.auto) return;
  const inp = m.input;
  const b = m.ball;
  u.lock = Math.max(0, u.lock - DT);
  const mine = (i) => i >= ut * 5 && i < ut * 5 + 5;
  if (b.holder >= 0 && mine(b.holder)) u.ctrl = b.holder;
  else if (m.phase === 'inbound' && m.inb && m.inb.team === ut) u.ctrl = m.inb.recv;
  else if (b.state === 'pass' && mine(b.passTo)) { /* keep the passer until the catch */ }
  else if (m.phase === 'tipoff') u.ctrl = ut * 5 + 4;
  else {
    const bx = b.land && b.state === 'loose' ? b.land.x : b.x, bz = b.land && b.state === 'loose' ? b.land.z : b.z;
    const dOf = (i) => Math.hypot(m.p[i].x - bx, m.p[i].z - bz);
    let best = ut * 5, bd = 1e9;
    for (let i = ut * 5; i < ut * 5 + 5; i++) { const dd = dOf(i); if (dd < bd) { bd = dd; best = i; } }
    if (inp.switchP) {
      const order = [0, 1, 2, 3, 4].map((s) => ut * 5 + s).filter((i) => i !== u.ctrl).sort((a, c) => dOf(a) - dOf(c));
      u.ctrl = order[0]; u.lock = 1.5; u.lastSwitch = m.time;
    } else if (u.ctrl < 0 || !mine(u.ctrl)) u.ctrl = best;
    else if (u.lock <= 0 && best !== u.ctrl && dOf(u.ctrl) - bd > 3 && m.time - u.lastSwitch > 0.8) { u.ctrl = best; u.lastSwitch = m.time; }
  }
  const i = u.ctrl;
  if (i < 0) return;
  const p = m.p[i];
  const r = R(m, i);
  const mag = Math.hypot(inp.mx, inp.mz);
  u.idle = mag < 0.1 ? u.idle + DT : 0;
  // movement intent
  const spd = (14 + 6 * r.spd) * (0.85 + 0.15 * r.energy) * (b.holder === i ? 0.92 : 1);
  if (m.phase === 'ft' || m.phase === 'tipoff' || (m.phase === 'inbound' && m.inb && m.inb.by === i)) { p.tx = p.x; p.tz = p.z; p.want = 0; }
  else if (mag > 0.1) { p.tx = p.x + inp.mx / mag * spd; p.tz = p.z + inp.mz / mag * spd * 0.8; p.want = Math.min(1, mag); }
  else if (b.holder !== i && m.poss !== ut && u.idle > 0.6) { decide(m, i, A, TEAM_AI); }
  else { p.tx = p.x; p.tz = p.z; p.want = 0; }
  if (m.phase === 'ft' || m.phase === 'tipoff') return;
  // buttons
  if (b.holder === i) {
    if (inp.shootP && m.phase === 'live') startShot(m, i);
    if (inp.passP) {
      if (m.phase === 'inbound') { const j = m.inb.recv; if (j !== i) doPass(m, i, j); }
      else { const j = bestPassTarget(m, i, inp.mx, inp.mz); if (j >= 0) doPass(m, i, j); }
    }
  } else {
    if (inp.passP) trySteal(m, i);
    if (inp.shootP) jump(m, i);
  }
}

// shooting gathers: AI releases at relAt; the user's shooter releases on button-up or overflow
function shooterTick(m) {
  if (m.phase !== 'live') return;
  for (let i = 0; i < 10; i++) {
    const p = m.p[i];
    if ((p.act !== 'shoot' && p.act !== 'layup') || m.ball.holder !== i) continue;
    p.actT += DT;
    const mt = meterTime(p.stype === 'jumper' ? 'jumper' : 'layup');
    p.meter = p.actT / mt;
    const user = isUserCtrl(m, i);
    if (p.stype !== 'jumper') { // keep driving at the rim
      const d = m.dir[p.t];
      p.tx = rimFor(d) - d * 1.5; p.tz = 25; p.want = 0.6;
    }
    if (p.forceQ != null && p.meter >= SWEET) { release(m, i); continue; }
    if (user ? (m.input.shootR || !m.input.shoot || p.meter >= 1.18) && p.actT > 0.06 : p.meter >= p.relAt) release(m, i);
  }
}

function inboundTick(m) {
  const inb = m.inb;
  if (!inb) return;
  const by = m.p[inb.by];
  if (!inb.ready) {
    // walking to the spot after a made basket (the clock keeps running)
    by.tx = inb.x; by.tz = inb.z; by.want = 1;
    if (Math.hypot(by.x - inb.x, by.z - inb.z) < 1.2 || m.phaseT > 2.5) { place(m, inb.by, inb.x, inb.z); inb.ready = true; inb.t = 0; }
    m.ball.holder = inb.by;
    return;
  }
  inb.t += DT;
  const userTeam = m.user.team === inb.team && !m.user.auto;
  const go = userTeam ? inb.t > 1.6 : inb.t > 0.7 + (m.rs & 7) * 0.05;
  if (m.ball.state === 'held' && m.ball.holder === inb.by && go) {
    let j = inb.recv;
    if (!userTeam) { const b = bestPassTarget(m, inb.by); if (b >= 0) j = b; }
    doPass(m, inb.by, j);
  }
  if (inb.t > 5 && m.ball.state === 'held') { // 5-second violation
    say(m, 'whistle', { why: '5sec' }); log(m, '5-second violation');
    R(m, inb.by).st.to++;
    m.pend = { k: 'inbound', team: 1 - inb.team, kind: 'side', x: inb.x, delay: 0.6 }; m.phase = 'dead';
  }
}

function ftTick(m) {
  const ft = m.ft;
  if (!ft) return;
  ft.t += DT;
  if (ft.state === 'aim') {
    const user = m.user.team === ft.team && !m.user.auto;
    const sp = 1.25 * (m.assist ? 0.75 : 1) * (user ? (DIFF[m.difficulty] || DIFF[1]).win ** -0.5 : 1);
    ft.mv += ft.md * DT * sp;
    if (ft.mv > 1) { ft.mv = 2 - ft.mv; ft.md = -1; } else if (ft.mv < 0) { ft.mv = -ft.mv; ft.md = 1; }
    let q = null;
    if (ft.force != null) { q = ft.force; ft.force = null; }
    else if (user && ft.t > 0.35 && m.input.shootP) {
      const off = Math.abs(ft.mv - 0.5), band = 0.08 * (m.assist ? 1.5 : 1);
      q = off <= band ? 1 : clamp(1 - (off - band) * 2.4, 0, 1);
      ft.label = q >= 1 ? 'PERFECT' : q > 0.6 ? 'GOOD' : ft.mv < 0.5 ? 'EARLY' : 'LATE';
    } else if (!user && ft.t > 1.1) q = clamp(0.5 + R(m, ft.by).ft * 0.45 + gauss(m) * 0.25, 0, 1);
    if (q != null) {
      const r = R(m, ft.by);
      const make = rnd(m) < ftChance(r.ft, q);
      const p = m.p[ft.by], d = m.dir[p.t];
      const x0 = p.x + d * 0.5, y0 = hFt(m, ft.by) + 0.6, z0 = p.z;
      const rx = rimFor(d);
      const tx = make ? rx : rx + (rnd(m) < 0.5 ? -d : d) * 0.8, tz = make ? 25 : 25 + (rnd(m) - 0.5) * 0.8, ty = make ? 10 : 10.15;
      const Tf = 0.95;
      r.st.fta++;
      Object.assign(m.ball, { state: 'shot', holder: -1, x: x0, y: y0, z: z0, lastTouch: p.t, vx: (tx - x0) / Tf, vz: (tz - z0) / Tf, vy: (ty - y0 + 0.5 * G * Tf * Tf) / Tf,
        shot: { by: ft.by, team: p.t, type: 'ft', three: false, make, airball: false, T: Tf, t: 0, foul: null, q, pts: 1, last: ft.left === 1 } });
      p.act = 'shoot'; p.actT = 0;
      ft.state = 'flight';
      say(m, 'shot', { i: ft.by, type: 'ft' });
    }
  }
}

// ---------------------------------------------------------------- movement
function integrate(m) {
  for (let i = 0; i < 10; i++) {
    const p = m.p[i];
    const r = R(m, i);
    const onGround = p.y <= 0 && p.vy <= 0;
    if (onGround) {
      let dvx = 0, dvz = 0;
      const frozen = p.act === 'shoot' || (m.phase === 'ft') || (m.phase === 'tipoff');
      if (!frozen) {
        const dx = p.tx - p.x, dz = p.tz - p.z, dd = Math.hypot(dx, dz);
        const max = (14 + 6 * r.spd) * (0.85 + 0.15 * r.energy) * (m.ball.holder === i ? 0.92 : 1) * (p.want ?? 1);
        if (dd > 0.25) { const sp = Math.min(max, dd * 3.2); dvx = dx / dd * sp; dvz = dz / dd * sp; }
      }
      const acc = 46 * DT;
      const ax = clamp(dvx - p.vx, -acc, acc), az = clamp(dvz - p.vz, -acc, acc);
      p.vx += ax; p.vz += az;
      if (frozen && m.phase !== 'live') { p.vx = p.vz = 0; }
    }
    p.x += p.vx * DT; p.z += p.vz * DT;
    if (p.y > 0 || p.vy > 0) {
      p.vy -= G * DT; p.y += p.vy * DT;
      if (p.y <= 0) { p.y = 0; p.vy = 0; if (p.act === 'jump' || p.act === 'shoot' || p.act === 'layup') { if (m.ball.holder !== i) { p.act = 'idle'; } } }
    }
    const holder = m.ball.holder === i && m.phase !== 'inbound';
    const lo = holder ? 0.4 : -2.5, hiX = holder ? COURT.L - 0.4 : COURT.L + 2.5, hiZ = holder ? COURT.W - 0.4 : COURT.W + 2.8;
    p.x = clamp(p.x, lo, hiX); p.z = clamp(p.z, holder ? 0.4 : -1.5, hiZ);
    // energy and minutes
    const moving = Math.hypot(p.vx, p.vz);
    // energy is paced to the quarter length so subs come about once a quarter at any setting
    const k = 0.5 / m.rules.qLen;
    if (m.clock.running) { r.energy = Math.max(0.2, r.energy - DT * k * (0.5 + 0.5 * Math.min(1, moving / 15))); r.st.sec += DT; }
  }
  // bench recovery
  if (m.clock.running) { const k = 1.4 / m.rules.qLen; for (const T of m.teams) T.roster.forEach((r, j) => { if (!T.onCourt.includes(j)) r.energy = Math.min(1, r.energy + DT * k); }); }
  // keep bodies apart
  for (let a = 0; a < 10; a++) for (let b = a + 1; b < 10; b++) {
    const P = m.p[a], Q = m.p[b];
    const dx = Q.x - P.x, dz = (Q.z - P.z) * 1.4, dd = Math.hypot(dx, dz);
    if (dd < 1.5 && dd > 1e-4) {
      const push = (1.5 - dd) * 0.5;
      P.x -= dx / dd * push; P.z -= dz / dd * push / 1.4; Q.x += dx / dd * push; Q.z += dz / dd * push / 1.4;
    }
  }
  for (const p of m.p) {
    if (m.ball.holder === p.idx) p.face = m.dir[p.t];
    else if (Math.abs(p.vx) > 2) p.face = Math.sign(p.vx);
    else p.face = m.ball.x >= p.x ? 1 : -1;
  }
}

function animate(m) {
  for (const p of m.p) {
    p.actT += p.act === 'shoot' || p.act === 'layup' ? 0 : DT;
    if ((p.act === 'pass' || p.act === 'steal') && p.actT > 0.25) p.act = 'idle';
    p.run = (p.run + Math.hypot(p.vx, p.vz) * DT * 0.55) % (Math.PI * 2);
  }
}

// ---------------------------------------------------------------- ball
function predictLand(b) {
  // where the ball will be when it next falls through ~4 ft
  let x = b.x, y = b.y, z = b.z, vx = b.vx, vy = b.vy, vz = b.vz;
  for (let k = 0; k < 180; k++) {
    vy -= G * DT; x += vx * DT; y += vy * DT; z += vz * DT;
    if (vy < 0 && y < 4) break;
  }
  return { x: clamp(x, 1, COURT.L - 1), z: clamp(z, 1, COURT.W - 1) };
}

function ballTick(m) {
  const b = m.ball;
  if (b.state === 'held') {
    const p = m.p[b.holder];
    if (!p) return;
    const shooting = p.act === 'shoot' || p.act === 'layup';
    const moving = Math.hypot(p.vx, p.vz) > 1.5;
    b.x = p.x + p.face * 0.9; b.z = p.z + 0.3;
    if (shooting) { b.y = hFt(m, b.holder) + p.y + 0.6; b.x = p.x + p.face * 0.35; }
    else if (m.phase === 'inbound' || m.phase === 'ft' || m.phase === 'dead') b.y = hFt(m, b.holder) * 0.55;
    else if (moving || p.holdT > 0.5) {
      b.dp = (b.dp || 0) + DT * 8.5;
      const s = Math.abs(Math.sin(b.dp));
      const n = Math.floor(b.dp / Math.PI);
      if (n !== b.dn) { b.dn = n; say(m, 'bounce', { i: b.holder }); }
      b.y = BALL_R + s * (hFt(m, b.holder) * 0.5);
    } else b.y = hFt(m, b.holder) * 0.6;
    return;
  }
  if (b.state === 'pass') {
    b.pt += DT;
    const f = b.pt / b.pT;
    const fx = Math.min(f, 1.3);
    b.x = b.px0 + (b.px1 - b.px0) * fx; b.z = b.pz0 + (b.pz1 - b.pz0) * fx;
    b.y = Math.max(BALL_R, b.py0 + (4.2 - b.py0) * Math.min(fx, 1) + 1.2 * 4 * fx * (1 - fx));
    const pt = m.p[b.lastPasser]?.t ?? b.lastTouch;
    // interceptions: a defender whose hands reach the ball's path gets one try
    for (let k = (1 - pt) * 5; k < (1 - pt) * 5 + 5; k++) {
      if (b.tried.includes(k) || f < 0.15) continue;
      const q = m.p[k];
      if (Math.hypot(q.x - b.x, q.z - b.z) < 1.7 && b.y < reach(m, k)) {
        b.tried.push(k);
        const ai = aiOf(m, q.t);
        const ch = (0.12 + 0.35 * R(m, k).def) * (ai.steal ?? 1) * (b.inb ? 0.4 : 1);
        if (rnd(m) < ch) {
          R(m, k).st.stl++; R(m, b.lastPasser).st.to++;
          if (m.phase === 'inbound') { m.phase = 'live'; m.clock.running = m.clock.t > 0; m.inb = null; }
          gainBall(m, k, 'steal'); say(m, 'steal', { i: k }); log(m, `${m.teams[q.t].abbr} intercept #${R(m, k).num}`);
          return;
        }
      }
    }
    for (let k = pt * 5; k < pt * 5 + 5; k++) {
      if (k === b.lastPasser) continue;
      const q = m.p[k];
      if (Math.hypot(q.x - b.x, q.z - b.z) < (k === b.passTo ? 2.3 : 1.4) && f > 0.3) { gainBall(m, k, 'catch'); return; }
    }
    if (f >= 1.3) {
      b.state = 'loose'; b.vx = (b.px1 - b.px0) / b.pT * 0.5; b.vz = (b.pz1 - b.pz0) / b.pT * 0.5; b.vy = 0;
      if (m.phase === 'inbound') { m.phase = 'live'; m.clock.running = m.clock.t > 0; m.inb = null; }
      b.land = predictLand(b);
    }
    return;
  }
  if (b.state === 'shot') {
    const s = b.shot;
    s.t += DT;
    b.vy -= G * DT; b.x += b.vx * DT; b.y += b.vy * DT; b.z += b.vz * DT;
    // blocks: early in the flight, a jumping defender's hands
    if (s.type !== 'ft' && s.t < s.T * 0.45) {
      for (let k = (1 - s.team) * 5; k < (1 - s.team) * 5 + 5; k++) {
        if (b.tried.includes(k)) continue;
        const q = m.p[k];
        if (q.y > 0.4 && Math.hypot(q.x - b.x, q.z - b.z) < 1.9 && reach(m, k) >= b.y) {
          b.tried.push(k);
          const ch = 0.02 + 0.1 * R(m, k).blk - (s.type === 'dunk' ? 0.015 : 0);
          if (rnd(m) < ch) {
            R(m, k).st.blk++;
            b.state = 'loose'; b.vx = -b.vx * 0.35 + (rnd(m) - 0.5) * 8; b.vz = (rnd(m) - 0.5) * 10; b.vy = 4 + rnd(m) * 5;
            b.shot = null; b.lastTouch = q.t; b.land = predictLand(b); b.noPick = m.time + 0.2; b.fromShot = true;
            say(m, 'block', { i: k }); log(m, `${m.teams[q.t].abbr} block #${R(m, k).num}`);
            if (m.buzzerPending) m.pend = { k: 'qend', delay: 0.8 };
            return;
          }
        }
      }
    }
    if (s.t >= s.T) resolveShot(m);
    return;
  }
  if (b.state === 'net') {
    b.vy -= G * 0.6 * DT; b.y += b.vy * DT; b.netT = (b.netT || 0) + DT;
    if (b.y < BALL_R) { b.y = BALL_R; b.vy = 0; b.state = 'dead'; }
    return;
  }
  if (b.state === 'loose') {
    b.vy -= G * DT; b.x += b.vx * DT; b.y += b.vy * DT; b.z += b.vz * DT;
    if (b.y < BALL_R) {
      b.y = BALL_R;
      if (Math.abs(b.vy) > 3) { b.vy = -b.vy * 0.58; say(m, 'floor', {}); } else b.vy = 0;
      b.vx *= 0.86; b.vz *= 0.86;
    }
    if (!inBounds(b.x, b.z) && b.y < 4) { outOfBounds(m); return; }
    if (b.noPick && m.time < b.noPick) return;
    const cands = [];
    for (let k = 0; k < 10; k++) {
      const q = m.p[k];
      if (Math.hypot(q.x - b.x, q.z - b.z) < 2.0 && b.y < reach(m, k)) cands.push(k);
    }
    if (cands.length) {
      let tot = 0; const w = cands.map((k) => { const v = R(m, k).reb + 0.35 + (m.p[k].y > 0.3 ? 0.4 : 0); tot += v; return v; });
      let x = rnd(m) * tot, k = 0;
      while (x > w[k]) { x -= w[k]; k++; }
      const who = cands[Math.min(k, cands.length - 1)];
      const fromShot = b.fromShot;
      b.fromShot = false;
      gainBall(m, who, fromShot ? 'reb' : 'loose');
      if (m.phase === 'ft') { m.phase = 'live'; m.ft = null; }
    }
  }
}

function resolveShot(m) {
  const b = m.ball, s = b.shot, t = s.team;
  const shooter = s.by, r = R(m, shooter);
  if (s.make) {
    score(m, t, s.pts, shooter);
    if (s.type === 'ft') r.st.ftm++;
    else {
      r.st.fgm++; if (s.three) r.st.tpm++;
      if (b.lastPasser >= 0 && m.p[b.lastPasser].t === t && b.lastPasser !== shooter && m.time - b.passAt < 4.5) R(m, b.lastPasser).st.ast++;
    }
    say(m, 'swish', { three: s.three, type: s.type, t });
    b.state = 'net'; b.vx = b.vz = 0; b.vy = -6; b.x = rimFor(m.dir[t]); b.z = 25; b.y = 9.6; b.netT = 0;
    b.lastTouch = t;
    m.ball.shot = null;
    if (s.type === 'ft') return afterFT(m, true, s.last);
    m.clock.shotOff = m.clock.shotOff; // unchanged
    if (s.foul) { foulCall(m, s.foul.by, shooter, 'shoot'); m.pend = { k: 'ft', i: shooter, n: 1, delay: 1.0 }; m.phase = 'dead'; say(m, 'andone', { i: shooter }); return; }
    if (m.buzzerPending) { m.pend = { k: 'qend', delay: 0.9 }; return; }
    m.pend = { k: 'inbound', team: 1 - t, kind: 'base', delay: 0.55 };
    return;
  }
  // miss
  b.shot = null;
  if (s.type === 'ft') {
    say(m, 'rim', {});
    if (!s.last) { b.state = 'net'; b.vy = 5; return afterFT(m, false, false); }
  }
  if (s.airball) {
    b.state = 'loose'; b.fromShot = true; b.land = predictLand(b);
    say(m, 'airball', {});
  } else {
    const away = Math.atan2(b.z - 25, b.x - rimFor(m.dir[t]));
    const ang = away + (rnd(m) - 0.5) * 2.2;
    const sp = 5 + rnd(m) * 8;
    b.vx = Math.cos(ang) * sp; b.vz = Math.sin(ang) * sp * 1.4; b.vy = 6 + rnd(m) * 7;
    b.state = 'loose'; b.fromShot = true; b.noPick = m.time + 0.12; b.land = predictLand(b);
    say(m, 'rim', { hard: sp > 9 });
    if (m.poss === t) resetShot(m); // rim hit resets the shot clock
  }
  if (s.type === 'ft') { // last free throw missed: ball is live
    m.phase = 'live'; m.ft = null; m.clock.running = m.clock.t > 0;
    if (m.clock.t <= 0) { m.phase = 'dead'; m.pend = { k: 'qend', delay: 0.9 }; }
    return;
  }
  if (s.foul) { foulCall(m, s.foul.by, shooter, 'shoot'); b.state = 'dead'; m.pend = { k: 'ft', i: shooter, n: s.foul.fts, delay: 0.9 }; m.phase = 'dead'; return; }
  if (m.buzzerPending) { m.pend = { k: 'qend', delay: 0.9 }; }
}

function afterFT(m, made, wasLast) {
  const ft = m.ft;
  if (!ft) return;
  if (made) ft.made++;
  ft.left--;
  if (ft.left > 0) { m.pend = { k: 'ftnext', delay: 0.8 }; return; }
  // last one made: other team inbounds from the baseline
  m.ft = null;
  if (m.clock.t <= 0) { m.pend = { k: 'qend', delay: 0.8 }; return; }
  m.pend = { k: 'inbound', team: 1 - ft.team, kind: 'base', delay: 0.6 };
}

function outOfBounds(m) {
  const b = m.ball;
  const team = 1 - b.lastTouch;
  say(m, 'whistle', { why: 'oob' }); log(m, `out of bounds, ${m.teams[team].abbr} ball`);
  b.state = 'dead'; b.holder = -1;
  m.clock.running = false; m.phase = 'dead';
  if (m.buzzerPending || m.clock.t <= 0) { m.pend = { k: 'qend', delay: 0.8 }; return; }
  m.pend = { k: 'inbound', team, kind: 'side', x: b.x, delay: 0.7 };
}

function clockTick(m) {
  const c = m.clock;
  // safety net: time is up and nothing is pending (e.g. a loose ball after the horn)
  if (c.t <= 0 && !m.pend && !m.buzzerPending && m.ball.state !== 'shot' && !['qend', 'final', 'tipoff', 'ft'].includes(m.phase)) {
    c.running = false; m.phase = 'dead'; m.pend = { k: 'qend', delay: 0.4 }; return;
  }
  if (!c.running || m.phase === 'final' || m.phase === 'qend') return;
  c.t -= DT;
  if (!c.shotOff) {
    if (c.t < c.shot) c.shotOff = true;
    else c.shot -= DT;
  }
  if (c.t <= 0) {
    c.t = 0; c.running = false;
    say(m, 'buzzer', {}); log(m, `end of Q${c.q}`);
    if (m.ball.state === 'shot') { m.buzzerPending = true; return; } // a shot in the air still counts
    if (m.phase === 'ft' || (m.pend && m.pend.k === 'ft')) { m.buzzerPending = true; return; } // fouled at the horn: shoot them
    m.phase = 'dead';
    m.pend = { k: 'qend', delay: 0.4 };
    return;
  }
  if (!c.shotOff && c.shot <= 0 && m.phase === 'live') {
    c.shot = 0;
    if (!['held', 'pass', 'loose'].includes(m.ball.state)) return; // a shot in the air is judged at the rim
    say(m, 'whistle', { why: 'shotclock' }); log(m, `shot-clock violation ${m.teams[m.poss].abbr}`);
    m.scVio[m.poss]++;
    const h = m.ball.holder;
    if (h >= 0) R(m, h).st.to++;
    m.clock.running = false; m.phase = 'dead';
    m.pend = { k: 'inbound', team: 1 - m.poss, kind: 'side', x: m.ball.x, delay: 0.7 };
    m.ball.state = 'dead'; m.ball.holder = -1;
  }
}

// Jump into a game situation (challenges): quarter, clock, score and who inbounds.

const CREST_KEYS = Object.keys(MASCOT);

// Draw a crest badge centered at (cx, cy) with radius r.
function drawCrest(c, team, cx, cy, r, opts = {}) {
  const { primary, secondary, accent } = team.colors;
  // keep contrast inside the badge: if secondary is too close to primary, use accent
  const fg = contrast(primary, secondary) >= 2.2 ? secondary : accent;
  c.save(); c.translate(cx, cy); c.scale(r, r);
  shieldPath(c); c.fillStyle = primary; c.fill();
  c.lineWidth = 0.09; c.strokeStyle = fg; c.stroke();
  shieldPath(c); c.save(); c.clip();
  c.scale(0.74, 0.74); c.translate(0, -0.02);
  const fn = MASCOT[team.crest] || MASCOT.mono;
  fn(c, primary, fg, accent, team.short[0]);
  c.restore();
  if (opts.ring) { c.lineWidth = 0.04; c.strokeStyle = 'rgba(0,0,0,0.35)'; shieldPath(c); c.stroke(); }
  c.restore();
}

// A crest as a data-URL image (for DOM menus), cached.
const crestCache = new Map();
function crestURL(team, px = 64) {
  const k = `${team.key}|${px}`;
  if (crestCache.has(k)) return crestCache.get(k);
  let url = '';
  try {
    const cv = document.createElement('canvas'); cv.width = cv.height = px;
    drawCrest(cv.getContext('2d'), team, px / 2, px / 2, px * 0.46);
    url = cv.toDataURL();
  } catch (e) { url = ''; }
  crestCache.set(k, url);
  return url;
}

// ---------------------------------------------------------------- players
// Foot point at (x, y) on screen, s px/ft. pl = court player, r = roster player, kit = team kit.
function drawPlayer(c, x, y, s, pl, r, kit, o = {}) {
  const H = (r.height / 12) * s; // body height in px
  const lift = (pl.y || 0) * s;
  const f = pl.face || 1;
  const act = pl.act;
  const moving = Math.hypot(pl.vx || 0, pl.vz || 0) > 1.2 && lift === 0;
  const ph = pl.run || 0;
  const swing = moving ? Math.sin(ph * 2) : 0;
  const by = y - lift;
  const hipY = by - H * 0.47, shY = by - H * 0.79, headY = by - H * 0.89;
  const hw = H * 0.12; // half shoulder width
  c.lineCap = 'round'; c.lineJoin = 'round';
  // legs
  const leg = Math.max(2, H * 0.075);
  c.strokeStyle = r.look.skin; c.lineWidth = leg;
  const kneeOut = lift > 0 ? H * 0.06 : 0;
  for (const side of [-1, 1]) {
    const sw = swing * side * H * 0.12;
    c.beginPath(); c.moveTo(x + side * hw * 0.45, hipY); c.lineTo(x + side * hw * 0.5 + sw * 0.5 + side * kneeOut, hipY + H * 0.22 - kneeOut * 0.5); c.lineTo(x + side * hw * 0.42 + sw, by - (lift > 0 ? H * 0.05 : 0)); c.stroke();
    c.fillStyle = '#1B1B1F'; c.beginPath(); c.ellipse(x + side * hw * 0.42 + sw + f * leg * 0.4, by - (lift > 0 ? H * 0.05 : 0), leg * 0.95, leg * 0.5, 0, 0, TAU); c.fill();
    c.fillStyle = '#F4F1EA'; c.fillRect(x + side * hw * 0.42 + sw - leg * 0.5, by - H * 0.11 - (lift > 0 ? H * 0.05 : 0), leg, H * 0.04); // socks
  }

  c.fillStyle = kit.shorts;
  c.beginPath(); c.moveTo(x - hw * 1.0, hipY - H * 0.04); c.lineTo(x + hw * 1.0, hipY - H * 0.04); c.lineTo(x + hw * 1.08, hipY + H * 0.13); c.lineTo(x - hw * 1.08, hipY + H * 0.13); c.closePath(); c.fill();
  c.fillStyle = kit.trim; c.fillRect(x - hw * 1.08, hipY + H * 0.1, hw * 0.3, H * 0.03); c.fillRect(x + hw * 0.78, hipY + H * 0.1, hw * 0.3, H * 0.03);

  const arm = Math.max(1.8, H * 0.06);

  c.strokeStyle = kit.trim; c.lineWidth = Math.max(1, H * 0.018); c.stroke();
  if (kit.throwback) { c.fillStyle = kit.band; c.fillRect(x - hw * 0.95, shY + H * 0.1, hw * 1.9, H * 0.05); }
  // collar
  c.fillStyle = kit.trim; c.beginPath(); c.moveTo(x - hw * 0.35, shY); c.lineTo(x, shY + H * 0.05); c.lineTo(x + hw * 0.35, shY); c.closePath(); c.fill();
  if (kit.throwback) { c.strokeStyle = kit.band; c.lineWidth = 1; c.beginPath(); c.moveTo(x - 2, shY + H * 0.015); c.lineTo(x + 2, shY + H * 0.04); c.moveTo(x + 2, shY + H * 0.015); c.lineTo(x - 2, shY + H * 0.04); c.stroke(); }
  // number
  if (H > 22) {
    c.fillStyle = kit.num; c.font = `800 ${Math.round(H * 0.13)}px "Arial Black", Impact, system-ui, sans-serif`;
    c.textAlign = 'center'; c.textBaseline = 'middle';

  c.fillStyle = '#1B1B1F'; c.beginPath(); c.arc(x + f * hr * 0.45, headY - hr * 0.05, Math.max(0.8, hr * 0.13), 0, TAU); c.fill();

function poseArms(act, pl, f, H, moving, swing) {
  // each arm: [shoulder side, elbow dx, elbow dy, hand dx, hand dy] (in units of H relative to shoulder)
  if (act === 'shoot' || act === 'layup') return [[-1, f * 0.02, -0.12, f * 0.05, -0.24], [1, f * 0.08, -0.12, f * 0.07, -0.26]];
  if (act === 'jump') return [[-1, -0.1, -0.12, -0.06, -0.27], [1, 0.1, -0.12, 0.06, -0.27]];
  if (act === 'celebrate') { const w = Math.sin((pl.actT || 0) * 10) * 0.05; return [[-1, -0.12, -0.14, -0.15 + w, -0.3], [1, 0.12, -0.14, 0.15 - w, -0.3]]; }
  if (act === 'pass') return [[-1, f * 0.12, 0.04, f * 0.24, 0.02], [1, f * 0.14, 0.05, f * 0.26, 0.03]];
  if (act === 'steal') return [[-1, -0.05, 0.1, -0.05, 0.22], [1, f * 0.16, 0.08, f * 0.28, 0.14]];
  if (pl.hasBall) return [[-1, -0.1, 0.12, -0.08 - swing * 0.03, 0.27], [1, f * 0.12, 0.12, f * 0.2, 0.22]];
  if (pl.defending) return [[-1, -0.16, 0.06, -0.24, 0.0], [1, 0.16, 0.06, 0.24, 0.0]];
  return [[-1, -0.07 - swing * 0.05, 0.14, -0.06 - swing * 0.08, 0.28], [1, 0.07 + swing * 0.05, 0.14, 0.06 + swing * 0.08, 0.28]];
}

function drawHair(c, x, y, r, look, f) {
  c.fillStyle = look.hairC;
  switch (look.hair) {
    case 'buzz': c.beginPath(); c.arc(x, y - r * 0.15, r * 1.0, Math.PI, 0); c.fill(); break;
    case 'high': c.fillRect(x - r * 0.95, y - r * 1.75, r * 1.9, r * 1.2); break;
    case 'curl': for (let k = 0; k < 5; k++) { c.beginPath(); c.arc(x - r * 0.8 + k * r * 0.4, y - r * 0.85, r * 0.42, 0, TAU); c.fill(); } break;
    case 'pony': c.beginPath(); c.arc(x, y - r * 0.2, r * 1.05, Math.PI, 0); c.fill(); c.beginPath(); c.ellipse(x - f * r * 1.2, y + r * 0.2, r * 0.4, r * 0.9, f * 0.4, 0, TAU); c.fill(); break;
    case 'bun': c.beginPath(); c.arc(x, y - r * 0.2, r * 1.05, Math.PI, 0); c.fill(); c.beginPath(); c.arc(x, y - r * 1.3, r * 0.5, 0, TAU); c.fill(); break;
    case 'puffs': c.beginPath(); c.arc(x - r * 0.95, y - r * 0.9, r * 0.55, 0, TAU); c.arc(x + r * 0.95, y - r * 0.9, r * 0.55, 0, TAU); c.fill(); c.beginPath(); c.arc(x, y - r * 0.2, r, Math.PI, 0); c.fill(); break;
    case 'braids': c.beginPath(); c.arc(x, y - r * 0.2, r * 1.05, Math.PI, 0); c.fill(); c.fillRect(x - r * 1.1, y - r * 0.2, r * 0.35, r * 1.6); c.fillRect(x + r * 0.75, y - r * 0.2, r * 0.35, r * 1.6); break;
    case 'band': case 'short': default: c.beginPath(); c.arc(x, y - r * 0.25, r * 1.02, Math.PI * 1.05, -0.05); c.fill();
  }
}

// ---------------------------------------------------------------- floor (cached by size + home team)
// The finals arena gets a neutral floor (no school paint or crest) with a Deco sunburst at center.
const ARENA_FLOOR = { key: 'arena', colors: { primary: '#2B3A5C', secondary: '#D4AF37', accent: '#F4F1EA' }, crest: 'arena', short: 'S' };

function buildFloor(v, home, dpr) {
  const s = v.s, mx = 6, mz = 3.5, K = v.K;
  const w = Math.ceil((COURT.L + mx * 2) * s), h = Math.ceil((COURT.W + mz * 2) * K * s + 2);
  const cv = document.createElement('canvas'); cv.width = Math.ceil(w * dpr); cv.height = Math.ceil(h * dpr);
  const c = cv.getContext('2d'); c.scale(dpr, dpr);
  const X = (x) => (x + mx) * s, Z = (z) => (z + mz) * K * s;
  // apron
  c.fillStyle = '#5E3D25'; c.fillRect(0, 0, w, h);
  c.fillStyle = shade(home.colors.primary, -0.1); c.fillRect(X(-mx), Z(-mz), w, Z(0) - Z(-mz));
  c.fillRect(X(-mx), Z(COURT.W), w, h - Z(COURT.W));
  c.fillRect(X(-mx), Z(0), X(0) - X(-mx), Z(COURT.W) - Z(0)); c.fillRect(X(COURT.L), Z(0), X(COURT.L + mx) - X(COURT.L), Z(COURT.W) - Z(0));
  // hardwood strips (boards run the length of the court)
  const o = { rs: 1234 };
  c.fillStyle = '#C9965A'; c.fillRect(X(0), Z(0), X(COURT.L) - X(0), Z(COURT.W) - Z(0));
  const strip = 0.75; // ft
  for (let z = 0; z < COURT.W; z += strip) {
    const tone = 0.06 * (rnd(o) - 0.5);
    c.fillStyle = shade('#C9965A', tone);
    c.fillRect(X(0), Z(z), X(COURT.L) - X(0), Z(z + strip) - Z(z) + 0.5);
    c.fillStyle = 'rgba(80,45,15,0.18)'; c.fillRect(X(0), Z(z), X(COURT.L) - X(0), Math.max(0.5, s * 0.03));
    let x = rnd(o) * 6;
    while (x < COURT.L) { c.fillRect(X(x), Z(z), Math.max(0.5, s * 0.04), Z(z + strip) - Z(z)); x += 4 + rnd(o) * 6; }
  }
  // sheen
  const g = c.createLinearGradient(0, Z(0), 0, Z(COURT.W)); g.addColorStop(0, 'rgba(255,240,210,0.16)'); g.addColorStop(0.5, 'rgba(255,240,210,0)'); g.addColorStop(1, 'rgba(60,30,10,0.12)');
  c.fillStyle = g; c.fillRect(X(0), Z(0), X(COURT.L) - X(0), Z(COURT.W) - Z(0));
  // paint (keys) in the home color
  c.fillStyle = home.colors.primary; c.globalAlpha = 0.82;
  c.fillRect(X(0), Z(COURT.keyZ0), X(19) - X(0), Z(COURT.keyZ1) - Z(COURT.keyZ0));
  c.fillRect(X(COURT.L - 19), Z(COURT.keyZ0), X(COURT.L) - X(COURT.L - 19), Z(COURT.keyZ1) - Z(COURT.keyZ0));
  c.globalAlpha = 1;
  // center circle with a paterae rosette (Motif 9)
  c.save(); c.translate(X(47), Z(25)); c.scale(1, K);
  c.fillStyle = home.colors.primary; c.beginPath(); c.arc(0, 0, COURT.centerR * s, 0, TAU); c.fill();
  c.fillStyle = home.colors.secondary; c.globalAlpha = 0.85;
  for (let k = 0; k < 10; k++) { c.save(); c.rotate((k / 10) * TAU); c.beginPath(); c.ellipse(0, -COURT.centerR * s * 0.55, s * 0.55, s * 1.6, 0, 0, TAU); c.fill(); c.restore(); }
  c.globalAlpha = 1; c.fillStyle = home.colors.primary; c.beginPath(); c.arc(0, 0, s * 2.6, 0, TAU); c.fill();
  c.restore();
  if (home.key === 'arena') { // Deco sunburst (Motif 6), drawn flat on the floor
    c.save(); c.translate(X(47), Z(25)); c.scale(1, K); c.fillStyle = '#D4AF37';
    for (let k = 0; k < 16; k++) { c.save(); c.rotate((k / 16) * TAU); c.beginPath(); c.moveTo(-s * (k % 2 ? 0.25 : 0.45), 0); c.lineTo(0, -s * (k % 2 ? 1.7 : 2.4)); c.lineTo(s * (k % 2 ? 0.25 : 0.45), 0); c.closePath(); c.fill(); c.restore(); }
    c.beginPath(); c.arc(0, 0, s * 0.7, 0, TAU); c.fill(); c.restore();
  } else drawCrest(c, home, X(47), Z(25) - s * 0.2, s * 2.1);
  // lines
  c.strokeStyle = 'rgba(255,255,255,0.92)'; c.lineWidth = Math.max(1.5, s * 0.17);
  c.strokeRect(X(0), Z(0), X(COURT.L) - X(0), Z(COURT.W) - Z(0));
  c.beginPath(); c.moveTo(X(47), Z(0)); c.lineTo(X(47), Z(COURT.W)); c.stroke();
  c.save(); c.translate(X(47), Z(25)); c.scale(1, K); c.beginPath(); c.arc(0, 0, COURT.centerR * s, 0, TAU); c.stroke(); c.restore();
  for (const side of [0, 1]) {
    const rx = COURT.rimX[side], dir = side ? -1 : 1, base = side ? COURT.L : 0;
    c.strokeRect(Math.min(X(base), X(base + dir * 19)), Z(COURT.keyZ0), Math.abs(X(base + dir * 19) - X(base)), Z(COURT.keyZ1) - Z(COURT.keyZ0));

  document.body.classList.toggle('reduced', reducedMotion());
  R.reduced = reducedMotion();

}

// ---------------------------------------------------------------- match setup
function makeSide(key, program, cls, side, throwback, seed) {
  const t = teamFor(key, program, cls, seed);
  return { ...t, kit: kitFor(t, side, throwback) };
}
function startMatch(o) {
  const program = o.program || 'boys';
  const seed = o.seed ?? (state.seed || (Date.now() & 0xffff));
  const rosterSeed = o.rosterSeed ?? 1;
  const home = makeSide(o.home, program, o.cls, 'home', !!o.throwHome, rosterSeed);
  const away = makeSide(o.away, program, o.cls, 'away', !!o.throwAway, rosterSeed);
  if (home.kit.light === away.kit.light) { // throwback clash: the other team flips
    if (o.throwHome) away.kit = { ...kitFor(away, 'home'), light: true };

  }
  const user = o.user === 'away' ? 1 : o.user === 'none' ? -1 : 0;
  const venue = o.venue || 'home';
  const crowd = venue === 'arena' && user >= 0 && !(user === 0 ? home.fictional : away.fictional) ? user : -1;
  const m = createMatch({
    mode: o.mode, home, away, program, seed, user, venue, crowd,
    rules: { qLen: o.qLen ?? state.settings.qLen, shotClock: o.shotClock ?? state.settings.shotClock },
    difficulty: o.difficulty ?? state.settings.difficulty, assist: state.settings.assist, autoBreak: !!o.autoBreak,
  });
  if (o.start) startAt(m, { ...o.start, poss: o.start.poss === 'user' ? Math.max(0, user) : o.start.poss === 'opp' ? 1 - Math.max(0, user) : o.start.poss });
  m.venueInfo = { kind: venue, homeKey: o.home, awayKey: o.away, pennants: venue === 'home' ? banners(o.home, program) : [] };
  m.maxAllowed = o.maxAllowed ?? null;

}
function venueOf(m) {

}

function newExhibition(o = {}) {
  const p = state.pick;
  const opts = {
    mode: 'exhibition', home: o.home || p.home, away: o.away || p.away, program: o.program || p.program, user: o.user || p.side,
    qLen: o.qLen, shotClock: o.shotClock, difficulty: o.difficulty, venue: o.venue || 'home', seed: o.seed,
    throwHome: (o.home || p.home) === 'hot-springs' && (o.throwback ?? p.throwback) && state.save.unlocks.throwback,
    throwAway: (o.away || p.away) === 'hot-springs' && (o.throwback ?? p.throwback) && state.save.unlocks.throwback,
  };
  state.lastOpts = opts;
  state.mode = 'exhibition';
  state.match = startMatch(opts);
  enterGame();
}

function enterGame() {
  state.paused = false; state.finalShown = false; state.showBox = false;
  state.factSeed = (state.match.seed || 1) + 3;
  go('game', false);
}

// ---------------------------------------------------------------- season flow
function startSeason(o = {}) {
  const p = state.pick;

  persist();

}

  const S = state.season, g = nextGame(S);

  const homeKey = g.home ? S.school : g.opp, awayKey = g.home ? g.opp : S.school;
  const tb = state.save.unlocks.throwback && state.pick.throwback && S.school === 'hot-springs';
  state.mode = 'season';
  state.match = startMatch({ mode: 'season', home: homeKey, away: awayKey, program: S.program, cls: S.cls, user: g.home ? 'home' : 'away', venue: g.arena ? 'arena' : 'home', rosterSeed: S.seed, seed: o.seed ?? hash(`${S.school}${S.w}${S.l}${S.seed}`), throwHome: tb && g.home, throwAway: tb && !g.home });

}

  const wasFinal = S.phase === 'bracket' && S.bracket.round === 2;

  if (S.champion && wasFinal) {
    state.save.trophies.push({ school: S.school, program: S.program, cls: S.cls, label: `Season ${state.save.trophies.length + 1} state champions`, record: `${S.w}-${S.l}` });
  }
  persist();
}

// ---------------------------------------------------------------- challenges
function startChallenge(id, program, stepIdx = 0) {
  const c = challenge(id);
  const step = c.steps[stepIdx];
  const prog = step.program || program || c.program || 'boys';
  state.chal = { id, program: prog, step: stepIdx };
  state.mode = 'challenge';
  state.match = startMatch({
    mode: 'challenge', home: c.school, away: step.opp, program: prog, cls: team(c.school).cls, user: 'home', venue: c.venue, qLen: c.qLen, shotClock: c.shotClock ?? 35,
    start: step.start, throwHome: !!step.throwback, maxAllowed: step.maxAllowed, seed: state.seed || hash(id + stepIdx),
  });
  enterGame();
}
function challengeResult() {
  const m = state.match, c = challenge(state.chal.id), step = c.steps[state.chal.step];
  const ut = m.user.team;
  let ok = m.winner === ut;
  let note = '';
  if (ok && step.maxAllowed != null) {
    const allowed = m.teams[1 - ut].score - (m.startScore ? m.startScore[1 - ut] : 0);
    ok = allowed <= step.maxAllowed;
    note = `You allowed ${allowed} point${allowed === 1 ? '' : 's'} (goal: ${step.maxAllowed} or fewer).`;
  }
  const more = ok && state.chal.step + 1 < c.steps.length;
  if (ok && !more) {
    state.save.challenges[c.id] = true;
    if (c.unlock) state.save.unlocks[c.unlock] = true;
    persist();
  }
  return { ok, more, note, c };
}

// ---------------------------------------------------------------- shootout
function startShootout(o = {}) {
  const p = state.pick;
  const key = o.school || p.school, program = o.program || p.program;
  const t = teamFor(key, program, null, 1);
  state.mode = 'shootout';
  state.so = createShootout({ team: t, roster: t.roster, kit: kitFor(t, 'home'), seed: o.seed ?? (state.seed || (Date.now() & 0xffff)), difficulty: state.settings.difficulty, assist: state.settings.assist });
  state.paused = false;

// ---------------------------------------------------------------- scenes
function go(name, push = true) {
  if (push && state.scene !== name) state.stack.push(state.scene);
  state.scene = name;
  render();
}
function back() {
  const prev = state.stack.pop() || 'title';
  state.scene = prev;
  render();
}

function screenHTML() {
  const st = { ...state, settings: state.settings, save: state.save, mode: state.mode };
  const m = state.match;
  switch (state.scene) {
    case 'title': return UI.titleScreen(st);
    case 'select': return UI.selectScreen(st);
    case 'seasonSetup': return UI.seasonSetupScreen(st);
    case 'hub': return state.season ? UI.hubScreen(st, UI.pickFact(state.season.w * 3 + state.season.l * 7 + state.season.seed)) : UI.titleScreen(st);
    case 'roster': { const rv = state.rosterView; return UI.rosterScreen(st, rv.key, rv.program, makeRoster(rv.key, rv.program, rv.cls, rv.seed)); }
    case 'bracket': return state.season && state.season.bracket ? UI.bracketScreen(st) : '';
    case 'pause': return m ? UI.pauseScreen(st, m, state.showBox) : '';
    case 'break': return m ? UI.breakScreen(m, UI.pickFact(state.factSeed + m.clock.q)) : '';
    case 'final': return m ? finalHTML(st) : '';
    case 'champion': return UI.championScreen(st);
    case 'shootoutSetup': return UI.shootoutSetupScreen(st);
    case 'shootoutEnd': return UI.shootoutEndScreen(st, state.so, state.so && state.so.newBest);
    case 'challenges': return UI.challengesScreen(st);
    case 'trophies': return UI.trophiesScreen(st);
    case 'help': return UI.helpScreen(st, state.helpTab);
    case 'settings': return UI.settingsScreen(st, store.ok);
    default: return '';
  }
}
function finalHTML(st) {
  const m = state.match;
  const tops = [0, 1].map((t) => { const r = topPerformer(m, t); return { team: m.teams[t].short, num: r.num, name: fullName(r), pts: r.st.pts, reb: r.st.reb, ast: r.st.ast }; });
  let extra = '';
  if (state.mode === 'challenge' && state.chalResult) {
    const cr = state.chalResult;
    extra = `<section class="card ${cr.ok ? 'ok' : 'bad'}"><h3>${cr.ok ? (cr.more ? 'Step complete' : 'Challenge complete!') : 'Challenge not completed'}</h3><p>${UI.esc(cr.note || (cr.ok ? (cr.more ? 'One down. The next final is up.' : cr.c.unlock ? 'You unlocked the 1912-style throwback kit.' : 'Saved to your Trophy Room.') : 'Give it another try.'))}</p></section>`;
  }

function render() {
  const sc = state.scene;
  document.body.dataset.scene = sc;
  const scr = $('#screen');
  const html = screenHTML();
  const overlay = !IN_PLAY.has(sc);
  scr.hidden = !overlay;
  if (overlay) {
    scr.innerHTML = html;
    scr.classList.remove('enter'); void scr.offsetWidth; scr.classList.add('enter');
    state.busy = reducedMotion() ? 0 : performance.now() + 220;
    const f = scr.querySelector('.btn.primary:not([disabled])') || scr.querySelector('button');
    if (f) f.focus({ preventScroll: true });
    scr.scrollTop = 0;
  }
  const showSB = OVER_GAME.has(sc) && (state.match || state.so);
  $('#sb').hidden = !showSB;
  $('#b-pause').hidden = !IN_PLAY.has(sc);
  $('#pad').hidden = !(IN_PLAY.has(sc) && touchOn());
  $('#pad').classList.toggle('so', sc === 'shootout');
  setEnabled(IN_PLAY.has(sc));
  if (sc === 'title') ensureDemo();
  layout();
  if (sc === 'champion' && !state.confettiShown) { state.confettiShown = true; play('win'); confetti(['#D4A017', '#F4F1EA', team(state.season.school).colors.primary, team(state.season.school).colors.secondary]); }
  if (sc !== 'champion') state.confettiShown = false;
  updateScoreboard(true);

}

// ---------------------------------------------------------------- loop
let raf = 0, last = 0, acc = 0;
function loopNeeded() {
  if (IN_PLAY.has(state.scene) && !state.paused) return true;
  if (state.scene === 'title' && state.demo && !reducedMotion()) return true;
  if (state.scene === 'champion' && !reducedMotion()) return true;
  return false;
}
function wantLoop() {
  if (loopNeeded()) { if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); } }
  else drawFrame(0);
}
function frame(ts) {
  raf = 0;
  const dt = Math.min(0.25, Math.max(0, (ts - last) / 1000)); last = ts;
  if (!state.paused) { acc += dt; let n = 0; while (acc >= DT && n < 30) { stepOnce(); acc -= DT; n++; } if (n >= 30) acc = 0; }
  drawFrame(dt);
  if (loopNeeded()) raf = requestAnimationFrame(frame);
}

function activeMatch() { return state.scene === 'title' ? state.demo : state.match; }

function stepOnce() {
  const sc = state.scene;
  if (sc === 'title' && state.demo) {
    const d = state.demo;
    tick(d); d.ev.length = 0;
    if (d.phase === 'final' && d.phaseT > 3) state.demo = null, ensureDemo();
    return;
  }
  if (sc === 'shootout' && state.so) {
    drain(state.so.input);
    shootoutTick(state.so);
    soEvents(state.so);
    if (state.so.phase === 'end' && state.so.phaseT > 0.8) endShootout();
    return;
  }
  const m = state.match;
  if (!m || sc !== 'game') return;
  drain(m.input);
  tick(m);
  matchEvents(m);
  if (m.phase === 'qend' && m.breakReady && !m.autoBreak) { state.paused = true; go('break', false); }
  else if (m.phase === 'final' && m.phaseT > 1.4 && !state.finalShown) onFinal();
}

function onFinal() {
  const m = state.match;
  state.finalShown = true; state.paused = true;
  const ut = m.user.team;
  if (ut >= 0) play(m.winner === ut ? 'win' : 'groan');
  announce(`Final: ${m.teams[0].short} ${m.teams[0].score}, ${m.teams[1].short} ${m.teams[1].score}.`);
  if (state.mode === 'season') finishSeasonGame();
  if (state.mode === 'challenge') state.chalResult = challengeResult();
  go('final', false);
}

function endShootout() {
  const so = state.so;
  if (state.scene !== 'shootout') return;
  so.newBest = so.score > (state.save.best.shootout || 0);
  if (so.newBest) { state.save.best.shootout = so.score; persist(); }
  play(so.newBest ? 'win' : 'buzzer');
  announce(`Time. ${so.score} points.`);
  go('shootoutEnd', false);
}

// ---------------------------------------------------------------- events → sound, effects, announcements
function rimSide(x) { return x > COURT.L / 2 ? 1 : 0; }
const WHY = { shotclock: 'SHOT CLOCK', oob: 'OUT OF BOUNDS', reach: 'FOUL', shoot: 'SHOOTING FOUL', '5sec': '5 SECONDS' };
function matchEvents(m) {
  for (const e of m.ev) {
    switch (e.k) {
      case 'score': {
        const side = rimSide(rimFor(m.dir[e.t]));
        pop(`+${e.pts}`, COURT.rimX[side], 11.5, 25, '#FFF6E0', e.pts === 3);
        if (e.pts === 3) burst('steam', COURT.rimX[side], 10, 25, 10, ['#fff']);
        play('cheer', { big: e.pts === 3 || m.teams[e.t].isUser });
        announce(`${m.teams[e.t].short} scores ${e.pts}. ${m.teams[0].short} ${m.teams[0].score}, ${m.teams[1].short} ${m.teams[1].score}.`);
        break;
      }
      case 'swish': netHit(rimSide(m.ball.x)); play('swish'); if (e.type === 'dunk') shake(0.6); break;
      case 'rim': rimHit(rimSide(m.ball.x)); play('rim', e); break;
      case 'bounce': play('bounce'); break;
      case 'floor': play('floor'); break;
      case 'whistle': play('whistle'); if (WHY[e.why]) pop(WHY[e.why], m.ball.x, 8, m.ball.z, '#FFB4A8'); if (e.why === 'shotclock') announce('Shot-clock violation.'); break;
      case 'buzzer': play('buzzer'); break;
      case 'steal': pop('STEAL!', m.p[e.i].x, 7, m.p[e.i].z, '#FFD84D'); play('steal'); break;
      case 'block': pop('BLOCKED!', m.p[e.i].x, 9, m.p[e.i].z, '#FFD84D'); play('block'); shake(0.4); break;
      case 'andone': pop('AND ONE!', m.p[e.i].x, 8, m.p[e.i].z, '#5FD38A', true); break;
      case 'fouledout': pop('FOULED OUT', m.ball.x, 8, m.ball.z, '#FFB4A8'); announce('A player has fouled out.'); break;
      case 'tip': play('squeak'); break;
      case 'airball': pop('AIRBALL', m.ball.x, 6, m.ball.z, '#FFB4A8'); break;
      case 'qend': announce(m.clock.q === 2 ? 'Halftime.' : `End of quarter ${m.clock.q}.`); break;
      case 'period': announce(m.clock.q > 4 ? 'Overtime.' : `Quarter ${m.clock.q}.`); break;
      default: break;
    }
  }
  m.ev.length = 0;
}
function soEvents(so) {
  for (const e of so.ev) {
    if (e.k === 'make') { pop(e.mult > 1 ? `+${e.pts} x${e.mult}` : `+${e.pts}`, e.x, 11.5, e.z, e.mult > 1 ? '#FFD84D' : '#FFF6E0', e.mult > 1); netHit(1); play('swish'); if (e.mult > 1) burst('steam', e.x, 10, e.z, 8, ['#fff']); }
    if (e.k === 'miss') { rimHit(1); play('rim'); }
    if (e.k === 'start') play('buzzer');
  }
  so.ev.length = 0;
}

const live = () => $('#live');
let lastAnnounce = '';
function announce(t) { if (t === lastAnnounce) t += ' '; lastAnnounce = t; const el = live(); if (el) el.textContent = t; }

// ---------------------------------------------------------------- drawing
function drawFrame(dt) {
  const sc = state.scene;
  if (state.so && (sc === 'shootout' || sc === 'shootoutEnd')) return drawShootout(dt);
  const m = activeMatch();
  if (m && (OVER_GAME.has(sc) || sc === 'title')) return drawMatch(m, dt);
  // menus: a quiet court of the relevant school behind the panel
  const key = state.season && (sc === 'hub' || sc === 'bracket' || sc === 'roster') ? state.season.school : state.pick.home || 'hot-springs';
  const t = team(key);
  const venue = { kind: sc === 'bracket' ? 'arena' : 'home', home: t, away: team(state.pick.away === key ? 'lakeside' : state.pick.away), pennants: banners(key, (state.season && state.season.program) || state.pick.program) };
  draw({ venue, dt, camX: 47, players: [] });
  updateScoreboard();
}

function drawMatch(m, dt) {
  const ut = m.user.team;
  const players = m.p.map((pl) => {
    const T = m.teams[pl.t];
    const r = T.roster[pl.r];
    pl.hasBall = m.ball.holder === pl.idx; pl.defending = m.poss !== pl.t && m.phase === 'live';
    return { pl, r, kit: T.kit, home: pl.t === 0, user: ut >= 0 && !m.user.auto && m.user.ctrl === pl.idx && state.scene !== 'title' };
  });

  if (m.ball.state === 'shot' && m.ball.shot) { const d = m.dir[m.ball.shot.team]; camX = (m.ball.x + rimFor(d) - d * 6) / 2; }
  if (m.phase === 'ft' && m.ft) camX = rimFor(m.dir[m.ft.team]) - m.dir[m.ft.team] * 10;

    const c = m.p[m.user.ctrl];

      const shooting = (c.act === 'shoot' || c.act === 'layup') && m.ball.holder === c.idx;
      const scale = (DIFF[m.difficulty] || DIFF[1]).win * (m.assist ? 1.5 : 1) * (m.crowdTeam === ut && m.crowd > 0.6 ? 1.3 : 1);
      if (shooting || m.user.meterLabelT > 0) meter = { x: c.x, z: c.z, y: c.y, h: r.height / 12, v: shooting ? c.meter : 0, win: 0.05 * scale * (c.stype === 'jumper' ? 1 : 1.6), label: m.user.meterLabelT > 0 ? m.user.meterLabel : null };
      offscreen = { x: c.x, z: c.z };
    }
    if (m.phase === 'ft' && m.ft && m.ft.state === 'aim') {
      const s = m.p[m.ft.by];
      ftMeter = { x: s.x, z: s.z, y: 9, mv: m.ft.mv, scale: m.assist ? 1.5 : 1, label: m.ft.label, n: m.ft.total - m.ft.left + 1, total: m.ft.total, user: m.ft.team === ut };
    }
  }
  draw({ m, venue: venueOf(m), dt, camX, players, ball: m.ball, meter, ftMeter, offscreen });
  updateScoreboard();
}

function drawShootout(dt) {
  const so = state.so;
  const players = [{ pl: so.sh, r: so.r, kit: so.kit, home: true, user: true }];
  const scale = (DIFF[so.difficulty] || DIFF[1]).win * (so.assist ? 1.5 : 1);
  const meter = so.sh.act === 'shoot' && so.ball.state === 'held' ? { x: so.sh.x, z: so.sh.z, y: so.sh.y, h: so.r.height / 12, v: so.sh.meter, win: 0.05 * scale, label: null }
    : so.labelT > 0 ? { x: so.sh.x, z: so.sh.z, y: so.sh.y, h: so.r.height / 12, v: 0, win: 0.05 * scale, label: so.label } : null;
  const venue = { kind: 'home', home: so.team, away: so.team, pennants: banners(so.team.key, so.r.id.includes('girls') ? 'girls' : 'boys') };
  draw({ venue, dt, camX: R.v && R.v.portrait ? (so.sh.x + COURT.rimX[1]) / 2 - 2 : COURT.rimX[1] - 14, players, ball: so.ball, meter });
  updateScoreboard();
}

// ---------------------------------------------------------------- scoreboard
let sbCache = '';
function updateScoreboard(force) {
  const sb = $('#sb');
  if (sb.hidden) return;
  const sc = state.scene;
  let html;
  if (state.so && (sc === 'shootout' || sc === 'shootoutEnd')) {
    const so = state.so;
    const gauge = Math.min(6, so.streak);
    html = `<div class="sb-team"><span class="sb-name">${UI.esc(so.team.abbr)}</span><span class="sb-score" aria-label="Score">${so.score}</span></div>
      <div class="sb-mid"><span class="sb-q">HOT STREAK</span><span class="sb-clock">${so.phase === 'ready' ? 'READY' : so.t.toFixed(1)}</span><span class="sb-shot">x${so.mult}</span></div>
      <div class="sb-team"><span class="sb-name">STEAM</span><span class="gauge" role="img" aria-label="Streak ${so.streak}">${Array.from({ length: 6 }, (_, k) => `<i class="${k < gauge ? 'on' : ''}"></i>`).join('')}</span></div>`;
  } else {
    const m = state.match;
    if (!m) return;
    const q = m.clock.q <= 4 ? `Q${m.clock.q}` : m.clock.q === 5 ? 'OT' : `${m.clock.q - 4}OT`;
    const qi = Math.min(m.clock.q, 4) - 1;
    const bonus = (t) => m.teams[1 - t].tf[qi] >= m.rules.bonusAt;
    const side = (t) => {
      const T = m.teams[t];
      return `<div class="sb-team${m.poss === t && m.phase !== 'final' ? ' poss' : ''}"><img class="crest" src="${crestSrc(T)}" width="28" height="28" alt=""><span class="sb-name">${UI.esc(T.abbr)}</span><span class="sb-score">${T.score}</span>
        <span class="sb-fouls">F ${T.tf[qi]}${bonus(t) ? ' <b>BONUS</b>' : ''}</span></div>`;
    };
    const shotTxt = !m.rules.shotClock ? '' : m.clock.shotOff ? '--' : Math.ceil(Math.max(0, m.clock.shot - 0.001));
    const crowd = m.crowdTeam >= 0 ? `<span class="sb-crowd" role="img" aria-label="Home crowd ${Math.round(m.crowd * 100)} percent"><i style="width:${Math.round(m.crowd * 100)}%"></i></span>` : '';
    html = `${side(0)}<div class="sb-mid"><span class="sb-q">${q}</span><span class="sb-clock">${fmtClock(m.clock.t)}</span>${m.rules.shotClock ? `<span class="sb-shot" title="Shot clock">${shotTxt}</span>` : '<span class="sb-shot off">CLASSIC</span>'}${crowd}</div>${side(1)}`;
  }

}
const crestSrc = (T) => crestURL(T, 56);

// ---------------------------------------------------------------- title demo
function ensureDemo() {
  if (state.demo) return;
  const k = (Date.now() / 1000) | 0;
  const a = COUNTY[k % 7], b = COUNTY[(k + 3) % 7];
  state.demo = startMatch({ mode: 'demo', home: a.key, away: b.key, program: k % 2 ? 'girls' : 'boys', user: 'none', qLen: 60, shotClock: 35, autoBreak: true, seed: k & 0xffff, venue: 'home' });
  for (let i = 0; i < 90; i++) tick(state.demo);
  state.demo.ev.length = 0;
}

// ---------------------------------------------------------------- layout
function layout() {
  const stage = $('#stage');
  const r = stage.getBoundingClientRect();
  const w = Math.max(200, Math.floor(r.width)), h = Math.max(160, Math.floor(r.height));
  if (!R.v || R.v.W !== w || R.v.H !== h) resize(w, h);
}

// ---------------------------------------------------------------- actions
const ACT = {
  title: () => { state.stack = []; state.match = null; state.so = null; state.paused = false; go('title', false); },
  back,
  hub: () => { state.stack = []; go('hub', false); },
  select: () => go('select'),
  seasonSetup: () => go('seasonSetup'),
  continueSeason: () => { state.stack = ['title']; go('hub', false); },
  shootoutSetup: () => go('shootoutSetup'),
  challenges: () => go('challenges'),
  trophies: () => go('trophies'),
  help: () => go('help'),
  settings: () => go('settings'),
  helpTab: (a) => { state.helpTab = a; render(); },
  roster: () => { const S = state.season; state.rosterView = { key: S.school, program: S.program, cls: S.cls, seed: S.seed }; go('roster'); },
  bracket: () => go('bracket'),
  pickProgram: (a) => { state.pick.program = a; render(); },
  pickHome: (a) => { state.pick.home = a; render(); },
  pickAway: (a) => { state.pick.away = a; render(); },
  pickSide: (a) => { state.pick.side = a; render(); },
  pickSchool: (a) => { state.pick.school = a; render(); },
  pickLength: (a) => { state.pick.length = a; render(); },
  setThrow: (a) => { state.pick.throwback = a === '1'; render(); },
  setQ: (a) => setSetting('qLen', +a),
  setClock: (a) => setSetting('shotClock', +a),
  setDiff: (a) => setSetting('difficulty', +a),
  setSound: (a) => setSetting('sound', a === '1'),
  setVol: (a) => setSetting('vol', +a),
  setMotion: (a) => setSetting('motion', a),
  setText: (a) => setSetting('text', +a),
  setTheme: (a) => setSetting('theme', a),
  setAssist: (a) => setSetting('assist', a === '1'),
  setTouch: (a) => setSetting('touch', a),
  startExhibition: () => { if (state.pick.home !== state.pick.away) newExhibition(); },
  rematch: () => { state.match = startMatch({ ...state.lastOpts, seed: undefined }); enterGame(); },
  startSeason: () => startSeason(),
  playSeason: () => playSeasonGame(),
  simSeason: () => { simCurrent(state.season); persist(); if (state.season.champion) { addSimTrophy(); go('champion', false); } else render(); },
  afterSeasonGame: () => { state.match = null; if (state.season.champion && state.season.done) go('champion', false); else { state.stack = ['title']; go('hub', false); } },
  playChallenge: (a) => { const [id, prog] = a.split('|'); startChallenge(id, prog); },
  afterChallenge: () => { const cr = state.chalResult; state.chalResult = null; if (cr && cr.more) startChallenge(state.chal.id, state.chal.program, state.chal.step + 1); else { state.match = null; state.stack = ['title']; go('challenges', false); } },
  startShootout: () => startShootout(),
  resume: () => { state.paused = false; go('game', false); },
  pause: () => pauseGame(),
  toggleBox: () => { state.showBox = !state.showBox; render(); },
  quit: () => { state.match = null; state.paused = false; if (state.mode === 'season') { state.stack = ['title']; go('hub', false); } else ACT.title(); },
  continueGame: () => { const m = state.match; startNextPeriod(m); state.paused = false; go('game', false); },
};
function addSimTrophy() {
  const S = state.season;
  if (!state.save.trophies.some((t) => t.seasonSeed === S.seed && t.school === S.school)) {
    state.save.trophies.push({ school: S.school, program: S.program, cls: S.cls, label: `Season ${state.save.trophies.length + 1} state champions`, record: `${S.w}-${S.l}`, seasonSeed: S.seed });
    persist();
  }
}
function setSetting(k, v) { state.settings[k] = v; applySettings(); persist(); render(); }
function pauseGame() {
  if (state.scene === 'game') { state.paused = true; go('pause', false); }
  else if (state.scene === 'shootout') { state.paused = !state.paused; wantLoop(); }
}

function onClick(e) {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  unlock();
  play('click');
  const f = ACT[b.dataset.act];
  if (f) f(b.dataset.arg);
}

function onKey(e) {
  unlock();
  const sc = state.scene;
  if (e.code === 'KeyM' && !e.repeat) { setSetting('sound', !state.settings.sound); return true; }
  if ((e.code === 'KeyP' || e.code === 'Escape') && !e.repeat) {
    if (sc === 'game' || sc === 'shootout') { pauseGame(); return true; }
    if (sc === 'pause') { ACT.resume(); return true; }
    if (e.code === 'Escape' && ['help', 'settings', 'roster', 'bracket'].includes(sc)) { back(); return true; }
    if (e.code === 'Escape' && ['select', 'seasonSetup', 'shootoutSetup', 'challenges', 'trophies'].includes(sc)) { ACT.title(); return true; }
  }
  return false;
}

// ---------------------------------------------------------------- boot
function boot() {
  restore();
  applySettings();
  initRender($('#cv'));
  initInput(onKey);
  initTouch($('#stick'), $('#knob'), { shoot: $('#b-shoot'), pass: $('#b-pass'), sw: $('#b-switch') });
  document.addEventListener('click', onClick);
  document.addEventListener('pointerdown', () => unlock(), { passive: true });
  $('#b-pause').addEventListener('click', () => pauseGame());
  window.addEventListener('resize', () => { layout(); wantLoop(); });
  for (const q of ['(prefers-color-scheme: dark)', '(prefers-reduced-motion: reduce)']) {
    try { window.matchMedia(q).addEventListener('change', () => { applySettings(); render(); }); } catch (e) { /* old browsers */ }
  }
  render();
  window.__game = HOOKS;
}

// ---------------------------------------------------------------- test hooks
function sumState() {
  const S = state.season;
  return {
    scene: state.scene, mode: state.mode, paused: state.paused, settings: { ...state.settings }, storageOk: store.ok,
    match: state.match ? summary(state.match) : null,
    season: S ? { school: S.school, program: S.program, cls: S.cls, length: S.length, w: S.w, l: S.l, idx: S.idx, phase: S.phase, champion: S.champion, done: S.done, eliminated: S.eliminated || null,
      games: S.games.map((g) => ({ opp: g.opp, home: g.home, month: g.month, rival: g.rival, result: g.result })), next: nextGame(S), bracket: S.bracket } : null,
    shootout: state.so ? { t: +state.so.t.toFixed(2), score: state.so.score, streak: state.so.streak, mult: state.so.mult, made: state.so.made, att: state.so.att, spot: state.so.spot, phase: state.so.phase, ball: state.so.ball.state, shooter: fullName(state.so.r) } : null,
    challenge: state.chal, chalResult: state.chalResult ? { ok: state.chalResult.ok, more: state.chalResult.more, note: state.chalResult.note } : null,
    trophies: state.save.trophies, unlocks: state.save.unlocks, best: state.save.best, challenges: state.save.challenges,
    pick: { ...state.pick }, audio: { ctx: !!AU.ctx, on: AU.on }, reduced: R.reduced, touch: touchOn(), fx: R.fx.parts.length, loop: !!raf,
    view: R.v ? { W: R.v.W, H: R.v.H, s: +R.v.s.toFixed(2), camX: +R.v.camX.toFixed(2) } : null,
    ui: { focus: document.activeElement ? (document.activeElement.dataset.act || document.activeElement.id || document.activeElement.tagName) : null },
  };
}

function stepN(n) {
  for (let i = 0; i < n; i++) stepOnce();
  drawFrame(n * DT);
  return state.match ? state.match.phase : state.so ? state.so.phase : null;
}

const HOOKS = {
  seed(n) { state.seed = n | 0; return n; },
  getState: sumState,
  setState(s) {
    if (s.settings) { Object.assign(state.settings, s.settings); applySettings(); persist(); }
    if (s.pick) Object.assign(state.pick, s.pick);
    if (s.unlocks) Object.assign(state.save.unlocks, s.unlocks);
    const m = state.match;
    if (m && s.match) {
      const x = s.match;
      if (x.q != null) m.clock.q = x.q;
      if (x.t != null) m.clock.t = x.t;
      if (x.shot != null) { m.clock.shot = x.shot; m.clock.shotOff = false; }
      if (x.score) { m.teams[0].score = x.score[0]; m.teams[1].score = x.score[1]; }
      if (x.teamFouls) { const qi = Math.min(m.clock.q, 4) - 1; m.teams[0].tf[qi] = x.teamFouls[0]; m.teams[1].tf[qi] = x.teamFouls[1]; }
      if (x.crowd != null) m.crowd = x.crowd;
      if (x.energy != null) for (const T of m.teams) for (const r of T.roster) r.energy = x.energy;
    }
    if (state.so && s.shootout) Object.assign(state.so, s.shootout);
    render();
    return true;
  },
  isIdle() { return performance.now() > state.busy; },
  step(n = 1) { return stepN(n); },
  pause() { state.paused = true; return true; },
  resume() { state.paused = false; wantLoop(); return true; },
  scene(name) {
    if (['game', 'pause', 'break', 'final'].includes(name) && !state.match) newExhibition({ seed: state.seed || 1 });
    if (name === 'hub' && !state.season) startSeason({ seed: state.seed || 1 });
    if (name === 'roster' && state.season) { const S = state.season; state.rosterView = { key: S.school, program: S.program, cls: S.cls, seed: S.seed }; }
    if (name === 'shootout' && !state.so) startShootout({ seed: state.seed || 1 });
    if (name === 'champion' && !state.season) return false;
    if (name === 'pause') state.paused = true;
    state.stack = name === 'title' ? [] : ['title'];
    go(name, false);
    return state.scene;
  },
  newGame(o = {}) {
    const mode = o.mode || 'exhibition';
    if (o.seed != null) state.seed = o.seed;
    if (mode === 'exhibition') newExhibition(o);
    else if (mode === 'season') { startSeason(o); if (o.play) playSeasonGame(); }
    else if (mode === 'challenge') startChallenge(o.challenge, o.program);
    else if (mode === 'shootout') startShootout(o);
    if (o.paused) state.paused = true;
    return sumState();
  },
  act(name, ...a) {
    const m = state.match;
    switch (name) {
      case 'autoplay': if (m) m.user.auto = !!a[0]; return true;
      case 'input': { const x = a[0] || {}; I.mx = x.mx || 0; I.mz = x.mz || 0; if (x.shoot != null) { if (x.shoot && !I.shoot) I.shootP = true; if (!x.shoot && I.shoot) I.shootR = true; I.shoot = !!x.shoot; } if (x.pass) I.passP = true; if (x.switch) I.switchP = true; return true; }
      case 'shootAt': { if (!m) return false; const h = m.ball.holder; if (h < 0) return false; return forceShot(m, h, a[0]); }
      case 'give': if (!m) return false; give(m, a[0] * 5 + a[1]); return true;
      case 'place': { if (!m) return false; const p = m.p[a[0] * 5 + a[1]]; p.x = p.tx = a[2]; p.z = p.tz = a[3]; p.vx = p.vz = 0; return true; }
      case 'foul': if (!m) return false; commitFoul(m, a[0], a[1] || 'reach'); return true;
      case 'ftStop': if (!m || !m.ft) return false; m.ft.force = a[0]; return true;
      case 'sim': if (!state.season) return false; ACT.simSeason(); return sumState().season;
      case 'finishGame': {
        if (!m) return false;
        m.user.auto = true; m.autoBreak = true;
        if (m.phase === 'qend') startNextPeriod(m);
        let n = 0;
        while (m.phase !== 'final' && n < 60 * 60 * 60) { tick(m); m.ev.length = 0; n++; }
        if (a[0] && a[0].winner != null && m.winner !== a[0].winner) { // force a result for flow tests
          const w = a[0].winner; m.teams[w].score = m.teams[1 - w].score + 2; m.winner = w;
        }
        m.user.auto = false; m.phaseT = 2;
        if (state.scene !== 'game') { state.scene = 'game'; }
        state.paused = false; stepOnce(); render();
        return summary(m);
      }
      case 'continue': if (state.scene === 'break') ACT.continueGame(); return state.scene;
      case 'shootoutShot': return state.so ? forceShootoutShot(state.so, a[0]) : false;
      case 'facts': return FACTS_LIST;
      case 'crests': return { keys: CREST_KEYS, teams: COUNTY.map((t) => ({ key: t.key, crest: t.crest, colorsConfirmed: t.colorsConfirmed, cls: t.cls, mascot: t.mascot, name: t.name, colors: t.colors })) };
      case 'banners': return banners(a[0], a[1]);
      case 'layout': {
        const rect = (s) => { const el = $(s); if (!el || el.hidden || !el.getClientRects().length) return null; const r = el.getBoundingClientRect(); return { x: r.x, y: r.y, w: r.width, h: r.height }; };
        return { stick: rect('#stick'), shoot: rect('#b-shoot'), pass: rect('#b-pass'), sw: rect('#b-switch'), pause: rect('#b-pause'), stage: rect('#stage'), sb: rect('#sb') };
      }
      case 'freeze': R.frozen = !!a[0]; return true;
      case 'roster': return makeRoster(a[0], a[1], a[2] || team(a[0]).cls, a[3] || 1);
      case 'storage': return store.ok;
      case 'seasonResult': if (!state.season) return false; recordResult(state.season, a[0], a[1]); if (state.season.champion) addSimTrophy(); persist(); render(); return sumState().season;
      case 'confetti': confetti(['#D4A017', '#F4F1EA', '#1F4E9C']); return true;
      case 'spots': return SPOTS;
      case 'meterQuality': return meterQuality(a[0], a[1] || 1, a[2] || 'jumper');
      default: return null;
    }
  },
};

boot();

return {  };
})();
</script>
