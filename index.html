/* Spa City Hoops. Palette values copied from shared/design/tokens.css (school-colors, gilded-spa, deco-neon). */
:root {
  --pal-deco-neon-bg: #14121F; --pal-deco-neon-surface: #1F1C2E; --pal-deco-neon-primary: #D4AF37; --pal-deco-neon-secondary: #7C5A2E;
  --pal-deco-neon-text: #D8CFBD; --pal-deco-neon-highlight: #4FC3FF;
  --pal-gilded-spa-bg: #E6D7B5; --pal-gilded-spa-surface: #F2EFE8; --pal-gilded-spa-text: #1F2A24;
  --font-deco: "Century Gothic", Futura, "Avenir Next", "Trebuchet MS", "Gill Sans", sans-serif;
  --font-sans: "Barlow Condensed", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; /* one text face throughout */
  --font-mono: "Courier New", Courier, ui-monospace, Menlo, Consolas, monospace;
  --font-neon: "Arial Black", Impact, "Helvetica Neue", sans-serif;
  --font-display: "Bebas Neue", "Arial Narrow", Impact, sans-serif;
  /* the text face (labels, body copy, HUD text): narrow enough to run large */
  --font-text: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  /* type scale: nothing a player reads is under 13 px */
  --fs-xs: .8125rem; --fs-sm: .9375rem; --fs-md: 1.0625rem; --fs-lg: 1.25rem; --fs-xl: 1.6rem; --fs-2xl: 2.1rem;
  --radius-sm: 3px; --radius-md: 6px; --radius-lg: 12px;
  /* night (default) */
  --bg: #14121F; --panel: rgba(31, 28, 46, 0.96); --card: #282439; --text: #E9E2D2; --muted: #B4ADBD; --primary: #D4AF37; --on-primary: #14121F;
  --line: #4A4462; --accent: #FF6B6B; --ok: #5FD38A; --focus: #4FC3FF; --tag-bg: #3A3550; --tag-fg: #F0E6C8; --scrim: rgba(10, 9, 16, 0.55);
}
.theme-light {
  --panel: rgba(242, 239, 232, 0.97); --card: #FFFFFF; --text: #1F2A24; --muted: #574A37; --primary: #8E3622; --on-primary: #FFFFFF;
  --line: #CDBF9F; --accent: #9A2A1C; --ok: #2E6A3C; --focus: #1F5FA8; --tag-bg: #E6D7B5; --tag-fg: #3B2E1E; --scrim: rgba(30, 20, 10, 0.35);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 500 var(--fs-md)/1.4 var(--font-text); overflow: hidden; -webkit-tap-highlight-color: transparent; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

#app { position: fixed; inset: 0; display: flex; flex-direction: column; }
#stage { position: relative; flex: 1 1 auto; min-height: 0; background: #14121F; }
#cv { position: absolute; inset: 0; display: block; touch-action: none; }
#gl { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }

/* ---------- scoreboard: a compact vintage gym board, lamp digits in a steel frame ---------- */
#sb { flex: 0 0 auto; display: grid; grid-template-columns: minmax(0, 270px) auto minmax(0, 270px); justify-content: center; align-items: stretch; gap: 6px; padding: 6px 10px; min-height: 58px;
  background: repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 4px), linear-gradient(#2B2833, #15131B); border-bottom: 3px solid #D4AF37; color: #FFF6E0;
  box-shadow: 0 4px 14px rgba(0,0,0,.45); position: relative; z-index: 2; }
#sb[hidden] { display: none; }
.sb-team { display: grid; grid-template-columns: auto 1fr auto auto; grid-template-rows: auto auto; align-items: center; column-gap: 8px; background: #0C0B10; border: 1px solid #3B3546;
  border-radius: var(--radius-md); padding: 4px 10px; min-width: 0; box-shadow: inset 0 0 12px rgba(0,0,0,.8); }
.sb-team .crest { grid-row: 1 / span 2; }
.sb-team:last-child { grid-template-columns: auto auto 1fr auto; }
.sb-team:last-child .crest { grid-column: 4; grid-row: 1 / span 2; }
.sb-team:last-child .sb-score { grid-column: 1; grid-row: 1; text-align: left; }
.sb-team:last-child .sb-arrow { grid-column: 2; grid-row: 1; transform: scaleX(-1); }
.sb-team:last-child .sb-name { grid-column: 3; grid-row: 1; text-align: right; }
.sb-team:last-child .sb-fouls { grid-column: 1 / span 3; text-align: left; }
.sb-name { font: 400 1.35rem/1 var(--font-display); letter-spacing: .06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-arrow { width: 0; height: 0; border-left: 8px solid #3A3546; border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
.sb-team.poss .sb-arrow { border-left-color: #FFD84D; filter: drop-shadow(0 0 4px #FFD84D); }
.sb-score { font: 700 1.9rem/1 var(--font-mono); color: #FFC83D; text-shadow: 0 0 8px rgba(255, 200, 61, .65); min-width: 2ch; text-align: right; }
.sb-fouls { grid-column: 2 / span 3; font: 700 var(--fs-xs) var(--font-text); letter-spacing: .1em; color: #E9E2D2; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.sb-team:last-child .sb-fouls { justify-content: flex-start; }
.sb-fouls b { color: #FFB4A8; letter-spacing: .1em; }
.lamps { display: inline-flex; gap: 3px; }
.lamps i { width: 7px; height: 7px; border-radius: 50%; background: #2C2833; box-shadow: inset 0 0 2px #000; }
.lamps i.on { background: #FF5A4A; box-shadow: 0 0 5px #FF5A4A; }
.sb-mid { display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0C0B10; border: 1px solid #3B3546; border-radius: var(--radius-md); padding: 3px 14px; min-width: 104px; box-shadow: inset 0 0 12px rgba(0,0,0,.8); }

  if (m.crowdTeam >= 0) m.crowd = clamp(m.crowd + (m.crowdTeam === t ? pts * 0.07 : -pts * 0.04), 0, 1);
  say(m, 'score', { t, pts, i: shooterIdx });
  log(m, `${m.teams[t].abbr} +${pts} #${r.num} (${m.teams[0].score}-${m.teams[1].score})`);
}

// ---------------------------------------------------------------- main tick
function tick(m) {
  m.time += DT; m.phaseT += DT;
  const inp = m.input;
  if (m.phase === 'final') { animate(m); clearEdges(inp); return; }
  if (m.phase === 'qend') {
    animate(m); integrate(m);
    if (m.phaseT > 1.6) { m.breakReady = true; if (m.autoBreak) startNextPeriod(m); }
    clearEdges(inp); return;
  }
  if (m.pend) {
    m.pend.delay -= DT;
    if (m.pend.delay <= 0) {
      const pd = m.pend; m.pend = null;
      if (pd.k === 'inbound') setupInbound(m, pd.team, pd.kind, pd.x);
      else if (pd.k === 'ft') setupFT(m, pd.i, pd.n);
      else if (pd.k === 'qend') toQEnd(m);
      else if (pd.k === 'ftnext' && m.ft) {
        const ft = m.ft;
        ft.state = 'aim'; ft.t = 0; ft.label = null;
        Object.assign(m.ball, { state: 'held', holder: ft.by });
        m.p[ft.by].act = 'idle';
      }
    }
  }
  if (m.phase === 'tipoff') tipoffTick(m);
  controlTick(m);
  for (let i = 0; i < 10; i++) {
    const p = m.p[i];
    p.cool = Math.max(0, p.cool - DT);
    p.holdT += DT;
    if (p.drive > 0) p.drive -= DT;
    if (isUserCtrl(m, i)) continue;
    if (p.drive > 0 && m.ball.holder === i && distToRim(p.x, p.z, m.dir[p.t]) < 4.2) startShot(m, i);
    p.aiT -= DT;
    if (p.aiT <= 0) decide(m, i, A, aiOf(m, p.t));
    if (p.jumpIn != null) { p.jumpIn -= DT; if (p.jumpIn <= 0) { p.jumpIn = null; if (m.ball.state === 'shot' || (m.ball.holder >= 0 && (m.p[m.ball.holder].act === 'shoot' || m.p[m.ball.holder].act === 'layup'))) jump(m, i); } }
  }
  shooterTick(m);
  if (m.phase === 'inbound') inboundTick(m);
  if (m.phase === 'ft') ftTick(m);
  integrate(m);
  ballTick(m);
  clockTick(m);
  animate(m);
  if (m.user.meterLabelT > 0) m.user.meterLabelT -= DT;
  clearEdges(inp);
}
function clearEdges(inp) { inp.shootP = inp.shootR = inp.passP = inp.switchP = false; }

const isUserCtrl = (m, i) => m.user.team >= 0 && !m.user.auto && m.user.ctrl === i;

function tipoffTick(m) {
  const t = m.phaseT;
  m.ball.x = 47; m.ball.z = 25; m.ball.y = 5.5 + 18 * t - 16 * t * t; // peak ~10.5 ft at 0.56 s
  const ut = m.user.team;
  const c0 = 4, c1 = 9;
  if (ut >= 0 && !m.user.auto && m.input.shootP && m.tip.userT < 0) { m.tip.userT = t; jump(m, ut * 5 + 4); }
  if (t > 0.3 && m.p[c0].y === 0 && !(ut === 0 && !m.user.auto)) jump(m, c0);
  if (t > 0.32 && m.p[c1].y === 0 && !(ut === 1 && !m.user.auto)) jump(m, c1);
  if (t >= 0.62 && !m.tip.done) {
    m.tip.done = true;
    let p0 = 0.5 + (R(m, c0).jmp + R(m, c0).height / 100 - R(m, c1).jmp - R(m, c1).height / 100) * 0.6;
    if (ut >= 0 && !m.user.auto) {
      const good = m.tip.userT >= 0.3 && m.tip.userT <= 0.6;
      const adj = m.tip.userT < 0 ? -0.15 : good ? 0.25 : -0.1;
      p0 += ut === 0 ? adj : -adj;
    }
    const win = rnd(m) < clamp(p0, 0.1, 0.9) ? 0 : 1;
    m.arrow = 1 - win;
    m.phase = 'live'; m.phaseT = 0; m.clock.running = true;
    m.ball.y = 10; m.ball.holder = win * 5 + 4;
    m.ball.state = 'held';
    m.possAt = 0; setPoss(m, win);
    doPass(m, win * 5 + 4, win * 5 + 0);
    say(m, 'tip', { t: win }); log(m, `tip won by ${m.teams[win].abbr}`);
  }
}

function controlTick(m) {
  const u = m.user, ut = u.team;
  if (ut < 0 || u.auto) return;
  const inp = m.input;
  const b = m.ball;
  u.lock = Math.max(0, u.lock - DT);
  const mine = (i) => i >= ut * 5 && i < ut * 5 + 5;
  if (b.holder >= 0 && mine(b.holder)) u.ctrl = b.holder;
  else if (m.phase === 'inbound' && m.inb && m.inb.team === ut) u.ctrl = m.inb.recv;
  else if (b.state === 'pass' && mine(b.passTo)) { /* keep the passer until the catch */ }
  else if (m.phase === 'tipoff') u.ctrl = ut * 5 + 4;
  else {
    const bx = b.land && b.state === 'loose' ? b.land.x : b.x, bz = b.land && b.state === 'loose' ? b.land.z : b.z;
    const dOf = (i) => Math.hypot(m.p[i].x - bx, m.p[i].z - bz);
    let best = ut * 5, bd = 1e9;
    for (let i = ut * 5; i < ut * 5 + 5; i++) { const dd = dOf(i); if (dd < bd) { bd = dd; best = i; } }
    if (inp.switchP) {
      const order = [0, 1, 2, 3, 4].map((s) => ut * 5 + s).filter((i) => i !== u.ctrl).sort((a, c) => dOf(a) - dOf(c));
      u.ctrl = order[0]; u.lock = 1.5; u.lastSwitch = m.time;
    } else if (u.ctrl < 0 || !mine(u.ctrl)) u.ctrl = best;
    else if (u.lock <= 0 && best !== u.ctrl && dOf(u.ctrl) - bd > 3 && m.time - u.lastSwitch > 0.8) { u.ctrl = best; u.lastSwitch = m.time; }
  }
  const i = u.ctrl;
  if (i < 0) return;
  const p = m.p[i];
  const r = R(m, i);
  const mag = Math.hypot(inp.mx, inp.mz);
  u.idle = mag < 0.1 ? u.idle + DT : 0;
  // movement intent
  const spd = (14 + 6 * r.spd) * (0.85 + 0.15 * r.energy) * (b.holder === i ? 0.92 : 1);
  if (m.phase === 'ft' || m.phase === 'tipoff' || (m.phase === 'inbound' && m.inb && m.inb.by === i)) { p.tx = p.x; p.tz = p.z; p.want = 0; }
  else if (mag > 0.1) { p.tx = p.x + inp.mx / mag * spd; p.tz = p.z + inp.mz / mag * spd * 0.8; p.want = Math.min(1, mag); }
  else if (b.holder !== i && m.poss !== ut && u.idle > 0.6) { decide(m, i, A, TEAM_AI); }
  else { p.tx = p.x; p.tz = p.z; p.want = 0; }
  if (m.phase === 'ft' || m.phase === 'tipoff') return;
  // buttons
  if (b.holder === i) {
    if (inp.shootP && m.phase === 'live') startShot(m, i);
    if (inp.passP) {
      if (m.phase === 'inbound') { const j = m.inb.recv; if (j !== i) doPass(m, i, j); }
      else { const j = bestPassTarget(m, i, inp.mx, inp.mz); if (j >= 0) doPass(m, i, j); }
    }
  } else {
    if (inp.passP) trySteal(m, i);
    if (inp.shootP) jump(m, i);
  }
}

// shooting gathers: AI releases at relAt; the user's shooter releases on button-up or overflow
function shooterTick(m) {
  if (m.phase !== 'live') return;
  for (let i = 0; i < 10; i++) {
    const p = m.p[i];
    if ((p.act !== 'shoot' && p.act !== 'layup') || m.ball.holder !== i) continue;
    p.actT += DT;
    const mt = meterTime(p.stype === 'jumper' ? 'jumper' : 'layup');
    p.meter = p.actT / mt;
    const user = isUserCtrl(m, i);
    if (p.stype !== 'jumper') { // keep driving at the rim
      const d = m.dir[p.t];
      p.tx = rimFor(d) - d * 1.5; p.tz = 25; p.want = 0.6;
    }
    if (p.forceQ != null && p.meter >= SWEET) { release(m, i); continue; }
    if (user ? (m.input.shootR || !m.input.shoot || p.meter >= 1.18) && p.actT > 0.06 : p.meter >= p.relAt) release(m, i);
  }
}

function inboundTick(m) {
  const inb = m.inb;
  if (!inb) return;
  const by = m.p[inb.by];
  if (!inb.ready) {
    // walking to the spot after a made basket (the clock keeps running)
    by.tx = inb.x; by.tz = inb.z; by.want = 1;
    if (Math.hypot(by.x - inb.x, by.z - inb.z) < 1.2 || m.phaseT > 2.5) { place(m, inb.by, inb.x, inb.z); inb.ready = true; inb.t = 0; }
    m.ball.holder = inb.by;
    return;
  }
  inb.t += DT;
  const userTeam = m.user.team === inb.team && !m.user.auto;
  const go = userTeam ? inb.t > 1.6 : inb.t > 0.7 + (m.rs & 7) * 0.05;
  if (m.ball.state === 'held' && m.ball.holder === inb.by && go) {
    let j = inb.recv;
    if (!userTeam) { const b = bestPassTarget(m, inb.by); if (b >= 0) j = b; }
    doPass(m, inb.by, j);
  }
  if (inb.t > 5 && m.ball.state === 'held') { // 5-second violation
    say(m, 'whistle', { why: '5sec' }); log(m, '5-second violation');
    R(m, inb.by).st.to++;
    m.pend = { k: 'inbound', team: 1 - inb.team, kind: 'side', x: inb.x, delay: 0.6 }; m.phase = 'dead';
  }
}

function ftTick(m) {
  const ft = m.ft;
  if (!ft) return;
  ft.t += DT;
  if (ft.state === 'aim') {
    const user = m.user.team === ft.team && !m.user.auto;
    const sp = 1.25 * (m.assist ? 0.75 : 1) * (user ? (DIFF[m.difficulty] || DIFF[1]).win ** -0.5 : 1);
    ft.mv += ft.md * DT * sp;
    if (ft.mv > 1) { ft.mv = 2 - ft.mv; ft.md = -1; } else if (ft.mv < 0) { ft.mv = -ft.mv; ft.md = 1; }
    let q = null;
    if (ft.force != null) { q = ft.force; ft.force = null; }
    else if (user && ft.t > 0.35 && m.input.shootP) {
      const off = Math.abs(ft.mv - 0.5), band = 0.08 * (m.assist ? 1.5 : 1);
      q = off <= band ? 1 : clamp(1 - (off - band) * 2.4, 0, 1);
      ft.label = q >= 1 ? 'PERFECT' : q > 0.6 ? 'GOOD' : ft.mv < 0.5 ? 'EARLY' : 'LATE';
    } else if (!user && ft.t > 1.1) q = clamp(0.5 + R(m, ft.by).ft * 0.45 + gauss(m) * 0.25, 0, 1);
    if (q != null) {
      const r = R(m, ft.by);
      const make = rnd(m) < ftChance(r.ft, q);
      const p = m.p[ft.by], d = m.dir[p.t];
      const x0 = p.x + d * 0.5, y0 = hFt(m, ft.by) + 0.6, z0 = p.z;
      const rx = rimFor(d);
      const tx = make ? rx : rx + (rnd(m) < 0.5 ? -d : d) * 0.8, tz = make ? 25 : 25 + (rnd(m) - 0.5) * 0.8, ty = make ? 10 : 10.15;
      const Tf = 0.95;
      r.st.fta++;
      Object.assign(m.ball, { state: 'shot', holder: -1, x: x0, y: y0, z: z0, lastTouch: p.t, vx: (tx - x0) / Tf, vz: (tz - z0) / Tf, vy: (ty - y0 + 0.5 * G * Tf * Tf) / Tf,
        shot: { by: ft.by, team: p.t, type: 'ft', three: false, make, airball: false, T: Tf, t: 0, foul: null, q, pts: 1, last: ft.left === 1 } });
      p.act = 'shoot'; p.actT = 0;
      ft.state = 'flight';
      say(m, 'shot', { i: ft.by, type: 'ft' });
    }
  }
}

// ---------------------------------------------------------------- movement
function integrate(m) {
  for (let i = 0; i < 10; i++) {
    const p = m.p[i];
    const r = R(m, i);
    const onGround = p.y <= 0 && p.vy <= 0;
    if (onGround) {
      let dvx = 0, dvz = 0;
      const frozen = p.act === 'shoot' || (m.phase === 'ft') || (m.phase === 'tipoff');
      if (!frozen) {
        const dx = p.tx - p.x, dz = p.tz - p.z, dd = Math.hypot(dx, dz);
        const max = (14 + 6 * r.spd) * (0.85 + 0.15 * r.energy) * (m.ball.holder === i ? 0.92 : 1) * (p.want ?? 1);
        if (dd > 0.25) { const sp = Math.min(max, dd * 3.2); dvx = dx / dd * sp; dvz = dz / dd * sp; }
      }
      const acc = 46 * DT;
      const ax = clamp(dvx - p.vx, -acc, acc), az = clamp(dvz - p.vz, -acc, acc);
      p.vx += ax; p.vz += az;
      if (frozen && m.phase !== 'live') { p.vx = p.vz = 0; }
    }
    p.x += p.vx * DT; p.z += p.vz * DT;
    if (p.y > 0 || p.vy > 0) {
      p.vy -= G * DT; p.y += p.vy * DT;
      if (p.y <= 0) { p.y = 0; p.vy = 0; if (p.act === 'jump' || p.act === 'shoot' || p.act === 'layup') { if (m.ball.holder !== i) { p.act = 'idle'; } } }
    }
    const holder = m.ball.holder === i && m.phase !== 'inbound';
    const lo = holder ? 0.4 : -2.5, hiX = holder ? COURT.L - 0.4 : COURT.L + 2.5, hiZ = holder ? COURT.W - 0.4 : COURT.W + 2.8;
    p.x = clamp(p.x, lo, hiX); p.z = clamp(p.z, holder ? 0.4 : -1.5, hiZ);
    // energy and minutes
    const moving = Math.hypot(p.vx, p.vz);
    // energy is paced to the quarter length so subs come about once a quarter at any setting
    const k = 0.5 / m.rules.qLen;
    if (m.clock.running) { r.energy = Math.max(0.2, r.energy - DT * k * (0.5 + 0.5 * Math.min(1, moving / 15))); r.st.sec += DT; }
  }
  // bench recovery
  if (m.clock.running) { const k = 1.4 / m.rules.qLen; for (const T of m.teams) T.roster.forEach((r, j) => { if (!T.onCourt.includes(j)) r.energy = Math.min(1, r.energy + DT * k); }); }
  // keep bodies apart
  for (let a = 0; a < 10; a++) for (let b = a + 1; b < 10; b++) {
    const P = m.p[a], Q = m.p[b];
    const dx = Q.x - P.x, dz = (Q.z - P.z) * 1.4, dd = Math.hypot(dx, dz);
    if (dd < 1.5 && dd > 1e-4) {
      const push = (1.5 - dd) * 0.5;
      P.x -= dx / dd * push; P.z -= dz / dd * push / 1.4; Q.x += dx / dd * push; Q.z += dz / dd * push / 1.4;
    }
  }
  for (const p of m.p) {
    if (m.ball.holder === p.idx) p.face = m.dir[p.t];
    else if (Math.abs(p.vx) > 2) p.face = Math.sign(p.vx);
    else p.face = m.ball.x >= p.x ? 1 : -1;
  }
}

function animate(m) {
  for (const p of m.p) {
    p.actT += p.act === 'shoot' || p.act === 'layup' ? 0 : DT;
    if ((p.act === 'pass' || p.act === 'steal') && p.actT > 0.25) p.act = 'idle';
    p.run = (p.run + Math.hypot(p.vx, p.vz) * DT * 0.55) % (Math.PI * 2);
  }
}

// ---------------------------------------------------------------- ball
function predictLand(b) {
  // where the ball will be when it next falls through ~4 ft
  let x = b.x, y = b.y, z = b.z, vx = b.vx, vy = b.vy, vz = b.vz;
  for (let k = 0; k < 180; k++) {
    vy -= G * DT; x += vx * DT; y += vy * DT; z += vz * DT;
    if (vy < 0 && y < 4) break;
  }
  return { x: clamp(x, 1, COURT.L - 1), z: clamp(z, 1, COURT.W - 1) };
}

function ballTick(m) {
  const b = m.ball;
  if (b.state === 'held') {
    const p = m.p[b.holder];
    if (!p) return;
    const shooting = p.act === 'shoot' || p.act === 'layup';
    const moving = Math.hypot(p.vx, p.vz) > 1.5;
    b.x = p.x + p.face * 0.9; b.z = p.z + 0.3;
    if (shooting) { b.y = hFt(m, b.holder) + p.y + 0.6; b.x = p.x + p.face * 0.35; }
    else if (m.phase === 'inbound' || m.phase === 'ft' || m.phase === 'dead') b.y = hFt(m, b.holder) * 0.55;
    else if (moving || p.holdT > 0.5) {
      b.dp = (b.dp || 0) + DT * 8.5;
      const s = Math.abs(Math.sin(b.dp));
      const n = Math.floor(b.dp / Math.PI);
      if (n !== b.dn) { b.dn = n; say(m, 'bounce', { i: b.holder }); }
      b.y = BALL_R + s * (hFt(m, b.holder) * 0.5);
    } else b.y = hFt(m, b.holder) * 0.6;
    return;
  }
  if (b.state === 'pass') {
    b.pt += DT;
    const f = b.pt / b.pT;
    const fx = Math.min(f, 1.3);
    b.x = b.px0 + (b.px1 - b.px0) * fx; b.z = b.pz0 + (b.pz1 - b.pz0) * fx;
    b.y = Math.max(BALL_R, b.py0 + (4.2 - b.py0) * Math.min(fx, 1) + 1.2 * 4 * fx * (1 - fx));
    const pt = m.p[b.lastPasser]?.t ?? b.lastTouch;
    // interceptions: a defender whose hands reach the ball's path gets one try
    for (let k = (1 - pt) * 5; k < (1 - pt) * 5 + 5; k++) {
      if (b.tried.includes(k) || f < 0.15) continue;
      const q = m.p[k];
      if (Math.hypot(q.x - b.x, q.z - b.z) < 1.7 && b.y < reach(m, k)) {
        b.tried.push(k);
        const ai = aiOf(m, q.t);
        const ch = (0.12 + 0.35 * R(m, k).def) * (ai.steal ?? 1) * (b.inb ? 0.4 : 1);
        if (rnd(m) < ch) {
          R(m, k).st.stl++; R(m, b.lastPasser).st.to++;
          if (m.phase === 'inbound') { m.phase = 'live'; m.clock.running = m.clock.t > 0; m.inb = null; }
          gainBall(m, k, 'steal'); say(m, 'steal', { i: k }); log(m, `${m.teams[q.t].abbr} intercept #${R(m, k).num}`);
          return;
        }
      }
    }
    for (let k = pt * 5; k < pt * 5 + 5; k++) {
      if (k === b.lastPasser) continue;
      const q = m.p[k];
      if (Math.hypot(q.x - b.x, q.z - b.z) < (k === b.passTo ? 2.3 : 1.4) && f > 0.3) { gainBall(m, k, 'catch'); return; }
    }
    if (f >= 1.3) {
      b.state = 'loose'; b.vx = (b.px1 - b.px0) / b.pT * 0.5; b.vz = (b.pz1 - b.pz0) / b.pT * 0.5; b.vy = 0;
      if (m.phase === 'inbound') { m.phase = 'live'; m.clock.running = m.clock.t > 0; m.inb = null; }
      b.land = predictLand(b);
    }
    return;
  }
  if (b.state === 'shot') {
    const s = b.shot;
    s.t += DT;
    b.vy -= G * DT; b.x += b.vx * DT; b.y += b.vy * DT; b.z += b.vz * DT;
    // blocks: early in the flight, a jumping defender's hands
    if (s.type !== 'ft' && s.t < s.T * 0.45) {
      for (let k = (1 - s.team) * 5; k < (1 - s.team) * 5 + 5; k++) {
        if (b.tried.includes(k)) continue;
        const q = m.p[k];
        if (q.y > 0.4 && Math.hypot(q.x - b.x, q.z - b.z) < 1.9 && reach(m, k) >= b.y) {
          b.tried.push(k);
          const ch = 0.02 + 0.1 * R(m, k).blk - (s.type === 'dunk' ? 0.015 : 0);
          if (rnd(m) < ch) {
            R(m, k).st.blk++;
            b.state = 'loose'; b.vx = -b.vx * 0.35 + (rnd(m) - 0.5) * 8; b.vz = (rnd(m) - 0.5) * 10; b.vy = 4 + rnd(m) * 5;
            b.shot = null; b.lastTouch = q.t; b.land = predictLand(b); b.noPick = m.time + 0.2; b.fromShot = true;
            say(m, 'block', { i: k }); log(m, `${m.teams[q.t].abbr} block #${R(m, k).num}`);
            if (m.buzzerPending) m.pend = { k: 'qend', delay: 0.8 };
            return;
          }
        }
      }
    }
    if (s.t >= s.T) resolveShot(m);
    return;
  }
  if (b.state === 'net') {
    b.vy -= G * 0.6 * DT; b.y += b.vy * DT; b.netT = (b.netT || 0) + DT;
    if (b.y < BALL_R) { b.y = BALL_R; b.vy = 0; b.state = 'dead'; }
    return;
  }
  if (b.state === 'loose') {
    b.vy -= G * DT; b.x += b.vx * DT; b.y += b.vy * DT; b.z += b.vz * DT;
    if (b.y < BALL_R) {
      b.y = BALL_R;
      if (Math.abs(b.vy) > 3) { b.vy = -b.vy * 0.58; say(m, 'floor', {}); } else b.vy = 0;
      b.vx *= 0.86; b.vz *= 0.86;
    }
    if (!inBounds(b.x, b.z) && b.y < 4) { outOfBounds(m); return; }
    if (b.noPick && m.time < b.noPick) return;
    const cands = [];
    for (let k = 0; k < 10; k++) {
      const q = m.p[k];
      if (Math.hypot(q.x - b.x, q.z - b.z) < 2.0 && b.y < reach(m, k)) cands.push(k);
    }
    if (cands.length) {

const CROWD_VERT = `
attribute vec4 aCell; attribute vec3 aTint; attribute vec2 aSize; attribute float aPhase; attribute float aStand; attribute float aTeam;
uniform vec3 uRight; uniform float uTime, uCheer, uCheerTeam;
varying vec2 vUv; varying vec3 vTint; varying float vShade;
void main() {
  vec4 o = modelMatrix * instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0);
  // a make lifts the scoring side (uCheerTeam 0 or 1); the other side barely stirs; -1 lifts everyone
  float side = uCheerTeam < 0.0 || abs(aTeam - uCheerTeam) < 0.5 ? 1.0 : 0.15;
  float bob = uCheer * side * (0.25 + 0.75 * aStand) * max(0.0, sin(uTime * 7.0 + aPhase * 6.28)) * 0.7 + sin(uTime * 1.3 + aPhase * 20.0) * 0.04;
  vec3 wp = o.xyz + uRight * (position.x * aSize.x) + vec3(0.0, (position.y + 0.5) * aSize.y + bob, 0.0);
  float fx = fract(aPhase * 7.31) < 0.5 ? (position.x + 0.5) : (0.5 - position.x);
  vUv = vec2(aCell.x + fx * aCell.z, aCell.y + (position.y + 0.5) * aCell.w);

}`;
const CROWD_FRAG = `
uniform sampler2D tAtlas; uniform float uLight;
varying vec2 vUv; varying vec3 vTint; varying float vShade;
void main() {

  if (c.a < 0.5) discard;
  c.rgb *= smoothstep(0.5, 0.95, c.a) * 0.6 + 0.4; // a soft dark edge where the white key left a fringe
  float mag = smoothstep(0.03, 0.12, min(c.r, c.b) - c.g);

  #include <tonemapping_fragment>

}`;

function makeCrowd(seats, atlas, palette, rng) {

  const recent = [];

    size.set([ht * (atlas.meta.cw / atlas.meta.ch) * (1 / sp.h) * sp.h, ht / sp.h * sp.h], i * 2);

    vertexShader: CROWD_VERT, fragmentShader: CROWD_FRAG,

}

// ---------------------------------------------------------------- static batching
// The venue is built from a few hundred boxes and planes. Merge every static, single-material mesh into one
// mesh per (material, layers, shadow flags), so the main, shadow and reflection passes each walk a handful of
// objects instead of hundreds.
function mergeStatic(root) {
  root.updateMatrixWorld(true);
  const groups = new Map();
  const victims = [];
  root.traverse((o) => {
    if (!o.isMesh || o.isInstancedMesh || o.isSkinnedMesh || o.userData.dyn || Array.isArray(o.material)) return;
    for (let p = o.parent; p && p !== root; p = p.parent) if (p.userData.dyn) return;
    const geo = o.geometry;
    if (!geo.index || !geo.attributes.normal || !geo.attributes.uv) return;
    const k = `${o.material.uuid}|${o.layers.mask}|${o.castShadow}|${o.receiveShadow}|${o.renderOrder}`;
    if (!groups.has(k)) groups.set(k, { mat: o.material, layers: o.layers.mask, cast: o.castShadow, recv: o.receiveShadow, ro: o.renderOrder, geos: [] });
    const g = geo.clone();
    for (const name of Object.keys(g.attributes)) if (!['position', 'normal', 'uv'].includes(name)) g.deleteAttribute(name);
    g.applyMatrix4(o.matrixWorld);
    groups.get(k).geos.push(g);
    victims.push(o);
  });
  for (const o of victims) { o.parent.remove(o); o.geometry.dispose(); }
  for (const gr of groups.values()) {
    const geo = THREE.mergeGeometries(gr.geos, false);
    for (const g of gr.geos) g.dispose();
    if (!geo) continue;
    const m = new THREE.Mesh(geo, gr.mat);
    m.layers.mask = gr.layers; m.castShadow = gr.cast; m.receiveShadow = gr.recv; m.renderOrder = gr.ro;
    root.add(m);
  }
}

// ---------------------------------------------------------------- the camera side (reverse angles only)

  const rows = arena ? 16 : 12, rd = arena ? 2.6 : 2.3, rh = arena ? 1.5 : 1.3, z0 = HW + (arena ? 12 : 9.5), len = arena ? 132 : 126;
  for (let r = 0; r < rows; r++) {

    const riser = new THREE.Mesh(new THREE.BoxGeometry(len, rh, 0.2), riserM); riser.position.set(0, y + rh / 2, z); g.add(riser);

// ---------------------------------------------------------------- textures from the painted pack
function loadImages(tex) {
  const out = {};
  const jobs = [];
  for (const k of ['floor', 'wall']) if (tex && tex[k]) { const img = new Image(); img.src = tex[k]; out[k] = img; jobs.push(img.decode()); }
  if (tex && tex.crowd) { const img = new Image(); img.src = tex.crowd.src; out.crowd = img; out.crowdMeta = tex.crowd; jobs.push(img.decode()); }
  return Promise.all(jobs).then(() => out);

function vignette(c, v, a) {
  const k = `${v.W}x${v.H}|${a}`;
  if (!vig || vig.k !== k) {
    const cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(v.W / 4)); cv.height = Math.max(1, Math.round(v.H / 4));
    const g = cv.getContext('2d'), r = Math.hypot(cv.width, cv.height) / 2;
    const gr = g.createRadialGradient(cv.width / 2, cv.height * 0.55, r * 0.45, cv.width / 2, cv.height * 0.55, r * 1.05);
    gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, `rgba(0,0,0,${a})`);
    g.fillStyle = gr; g.fillRect(0, 0, cv.width, cv.height);
    vig = { k, cv };
  }
  c.drawImage(vig.cv, 0, 0, v.W, v.H);
}

// 2D projector: court feet to screen px, and px per foot
const _p2 = { X: 0, Y: 0, s: 1, vis: true };
function P2(x, z, y = 0) { const v = R.v; _p2.X = sx(v, x); _p2.Y = sy(v, z, y); _p2.s = v.s; return _p2; }

// The HUD layer, shared by both renderers: YOU marker, particles, callouts, meters, off-screen arrow.
function drawHud(c, v, P, scene) {
  if (is3d() && !v.portrait) ballHalo(c, P, scene.ball); // landscape only: there the crowd is what sits behind the ball's arc
  for (const it of scene.players || []) if (it.user) chevron(c, v, P, it);
  for (const p of R.fx.parts) {
    const q = P(p.x, p.z, p.y), X = q.X, Y = q.Y, s = q.s;
    if (p.kind === 'conf') { c.fillStyle = p.c; c.save(); c.translate(X, Y); c.rotate(p.t * 5 + p.r * 6); c.fillRect(-3, -1.5, 6, 3); c.restore(); }
    else if (p.kind === 'steam') {
      if (is3d()) continue; // in 3D the rim flash and the cloth net carry the make; flat puffs read as ghost discs
      c.fillStyle = `rgba(255,255,255,${0.16 * (1 - p.t / p.life)})`; c.beginPath(); c.arc(X + Math.cos(p.r * 9) * s * 0.8, Y - p.t * s, s * (0.3 + p.t * 0.6), 0, TAU); c.fill(); }
    else { c.fillStyle = p.c; c.globalAlpha = 1 - p.t / p.life; c.beginPath(); c.arc(X, Y, Math.max(1.5, s * 0.12), 0, TAU); c.fill(); c.globalAlpha = 1; }
  }
  for (const p of R.fx.pops) {
    if (scene.slam && scene.slam.t < 0.12 && /^\+\d/.test(p.text)) continue; // the +3 follows the card's landing
    if (scene.slam && v.portrait && /^\+\d/.test(p.text)) continue; // phones: the card says it; the +3 would sit on the board
    const q = P(p.x, p.z, p.y);
    if (q.X < 0 || q.X > v.W || q.Y < 0 || q.Y > v.H || q.vis === false) continue; // its rim or player is off screen
    const X = clamp(q.X, 70, v.W - 70), Y = clamp(q.Y - p.t * q.s * 2.2, 40, v.H - 30);
    const size = Math.round(clamp(q.s * (p.big ? 1.6 : 1.05), p.big ? 26 : 17, p.big ? 54 : 34));
    c.font = `400 ${Math.round(size * 1.25)}px "Bebas Neue", "Arial Black", Impact, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.globalAlpha = Math.min(1, 2.2 - p.t * 1.7);
    const w = c.measureText(p.text).width;
    // a solid plate behind every callout so it reads on any floor
    c.fillStyle = 'rgba(14,12,22,0.82)';
    c.beginPath(); c.roundRect(X - w / 2 - size * 0.4, Y - size * 0.66, w + size * 0.8, size * 1.3, size * 0.3); c.fill();
    c.fillStyle = p.color; c.fillText(p.text, X, Y + 1);
    c.globalAlpha = 1;
  }
  if (scene.meter) drawMeter(c, v, P, scene.meter);
  if (scene.ftMeter) drawFTMeter(c, v, P, scene.ftMeter);
  if (scene.offscreen) offscreenArrow(c, v, P, scene.offscreen);
  if (scene.letterbox) { const h = Math.round(v.H * 0.07); c.fillStyle = '#000'; c.fillRect(0, 0, v.W, h); c.fillRect(0, v.H - h, v.W, h); }
  if (scene.banner) banner(c, v, scene.banner);
  R.slamBox = null;
  // a cinematic close camera (replays, close-ups) carries the moment itself: no card over the ball
  if (scene.slam && !(is3d() && G3.camOverride && !G3.camOverride.attract)) slamCallout(c, v, P, scene);
}

// A loose ball in 3D gets a soft dark halo, so it reads against the crowd and the floor alike (the ball itself
// stays clear: the halo starts outside its edge).
function ballHalo(c, P, b) {
  if (!b || b.state === 'held' || b.state === 'dead' || b.y < 7) return; // a high ball only: near the floor a dark disc reads as a smudge
  const q = P(b.x, b.z, b.y), r = Math.max(4, q.s * 0.45);
  if (r > 12 || G3.camOverride) return; // close and cinematic cameras show the ball well enough on their own
  const g = c.createRadialGradient(q.X, q.Y, r * 1.12, q.X, q.Y, r * 5);
  g.addColorStop(0, 'rgba(8,6,12,0.72)'); g.addColorStop(0.4, 'rgba(8,6,12,0.45)'); g.addColorStop(1, 'rgba(8,6,12,0)');
  c.fillStyle = g; c.beginPath(); c.arc(q.X, q.Y, r * 5, 0, TAU); c.arc(q.X, q.Y, r * 1.12, 0, TAU, true); c.fill();
}

// big-play callout: a slanted plate in the scoring team's color with speed streaks; slides in, holds, fades
function slamCallout(c, v, P, scene) {
  const s = scene.slam;
  const t = s.t, inT = Math.min(1, t / 0.14), out = t > 0.75 ? 1 - (t - 0.75) / 0.25 : 1;
  const size = Math.round(clamp(v.W * 0.085, 40, 92) * ((s.ref || s).scale || 1));
  let hPx = size * 1.15 + 12 + size * 0.5, wPx = Math.min(v.W - 16, size * 5.4);
  // the slot is chosen once, when the card appears, and kept: clear of the rim it went through, the ball and
  // every player (plus a margin), scored over a grid of candidate places; the card never jumps
  const ref = s.ref || s;
  if (!ref.slot) {
    const pad = v.portrait ? 40 : 24, keep = [];
    if (s.side != null) { const r = P(COURT.rimX[s.side], COURT.rimZ, COURT.rimY); keep.push({ x: r.X - 4 * r.s, y: r.Y - 9 * r.s, w: 8 * r.s, h: 15 * r.s, wt: 4 }); } // the rim, the board and the +3 above it
    if (scene.ball) { const b = P(scene.ball.x, scene.ball.z, Math.max(0.4, scene.ball.y)); keep.push({ x: b.X - 2 * b.s - pad, y: b.Y - 2 * b.s - pad, w: 4 * b.s + 2 * pad, h: 4 * b.s + 2 * pad, wt: 4 }); }
    // every player where they are and where they'll be in 0.7 s (play restarts under the card after a make)
    for (const it of scene.players || []) for (const ahead of [0, 0.35, 0.7]) {
      const x = it.pl.x + (it.pl.vx || 0) * ahead, z = it.pl.z + (it.pl.vz || 0) * ahead;
      const f = P(x, z, it.pl.y || 0), hd = P(x, z, (it.pl.y || 0) + it.r.height / 12);
      const ph = Math.abs(f.Y - hd.Y), pw = ph * 0.7;
      keep.push({ x: f.X - pw / 2 - pad, y: hd.Y - pad, w: pw + 2 * pad, h: ph + 2 * pad, wt: (it.user ? 3 : 1) * (ahead ? 0.6 : 1) });
    }
    const hit = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
    // first choice: the band over the crowd, under the score bug, where play rarely goes after a make
    const ys = v.portrait ? [0.14, 0.22, 0.34, 0.62, 0.8, 0.46, 0.53, 0.72] : [0.23, 0.74, 0.84, 0.56, 0.14], xs = [0.5, 0.3, 0.7];
    let best = null;
    for (const fy of ys) for (const fx of xs) {
      const cx = clamp(v.W * fx, wPx / 2 + 8, v.W - wPx / 2 - 8), box = { x: cx - wPx / 2, y: v.H * fy - hPx / 2, w: wPx, h: hPx };
      const cost = keep.reduce((n, k) => n + (hit(box, k) ? k.wt : 0), 0) + (fx !== 0.5 ? 0.3 : 0) + ys.indexOf(fy) * 0.1;
      if (!best || cost < best.cost) best = { cost, x: cx, y: v.H * fy };
    }
    // nothing clear at full size: a smaller card, placed again
    if (best.cost > 0.5 && !ref.small) { ref.small = true; ref.scale = 0.72; }
    ref.slot = best;
  }
  const y = ref.slot.y, cx = ref.slot.x;
  R.slamBox = { x: Math.round(cx - wPx / 2), y: Math.round(y - hPx / 2), w: Math.round(wPx), h: Math.round(hPx) };
  // it slides in from the right but never past the viewport edge (it fades in over the slide instead)
  const room = Math.max(0, v.W - 6 - (cx + wPx / 2));
  const slide = R.reduced ? 0 : Math.min((1 - inT) * v.W * 0.4, room);
  c.save();
  c.globalAlpha = Math.max(0, out) * (s.fade ?? 1) * Math.min(1, 0.25 + inT);
  c.translate(cx + slide, y);
  c.font = `400 ${size}px "Bebas Neue", "Arial Black", Impact, sans-serif`;
  const w = c.measureText(s.text).width + size * 1.2, h = size * 1.15;
  c.transform(1, 0, -0.18, 1, 0, 0);
  c.fillStyle = 'rgba(10,9,16,0.9)'; c.fillRect(-w / 2 - 8, -h / 2 - 6, w + 16, h + 12);
  c.fillStyle = s.color; c.fillRect(-w / 2, -h / 2, w, h);
  c.fillStyle = '#D4AF37'; c.fillRect(-w / 2, h / 2 - 5, w, 5);
  if (!R.reduced && !v.portrait) { c.fillStyle = 'rgba(255,255,255,0.35)'; for (let k = 0; k < 5; k++) c.fillRect(-w / 2 - 30 - k * 26 - (1 - inT) * 120, -h / 3 + k * h / 7, 18 + k * 6, 3); }
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.lineWidth = Math.max(4, size * 0.08); c.strokeStyle = '#0B0A10'; c.strokeText(s.text, 0, 3);
  c.fillStyle = '#FFF6E0'; c.fillText(s.text, 0, 3);
  if (s.sub && y > v.H * 0.4) { c.font = `400 ${Math.round(size * 0.34)}px "Bebas Neue", "Arial Black", sans-serif`; c.fillStyle = '#FFF6E0'; c.fillText(s.sub, 0, h / 2 + size * 0.32); }
  c.restore();
}

// "REPLAY" bug: a broadcast-style plate in the top-left corner
function banner(c, v, b) {
  const big = clamp(v.W * 0.03, 16, 26);
  c.font = `400 ${Math.round(big * 1.3)}px "Bebas Neue", "Arial Black", Impact, sans-serif`;
  const w = c.measureText(b.text).width + big * 1.6;
  const x = 12, y = 12, h = big * 1.7;
  c.fillStyle = 'rgba(14,12,22,0.88)'; c.beginPath(); c.roundRect(x, y, w, h, 6); c.fill();
  c.fillStyle = '#D4AF37'; c.fillRect(x, y, 6, h);
  c.fillStyle = '#FF4A3A'; c.beginPath(); c.arc(x + big * 0.75, y + h / 2, big * 0.22, 0, TAU); c.fill();
  c.fillStyle = '#FFF6E0'; c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillText(b.text, x + big * 1.15, y + h / 2 + 1);
  if (b.sub) {
    c.font = `700 ${Math.max(14, Math.round(big * 0.68))}px "Barlow Condensed", system-ui, sans-serif`;
    const sw = c.measureText(b.sub).width + 16;
    c.fillStyle = 'rgba(14,12,22,0.75)'; c.beginPath(); c.roundRect(x, y + h + 6, sw, big * 1.1, 5); c.fill();
    c.fillStyle = '#E9E2D2'; c.fillText(b.sub, x + 8, y + h + 6 + big * 0.56);
  }
}

function shadow(c, v, x, z, r, a) {
  c.fillStyle = `rgba(20,10,0,${Math.max(0.08, a)})`;
  c.beginPath(); c.ellipse(sx(v, x), sy(v, z), r * v.s, r * v.s * v.K * 0.9, 0, 0, TAU); c.fill();
}

function ring(c, v, it) {
  const X = sx(v, it.pl.x), Y = sy(v, it.pl.z);
  c.save();
  c.lineWidth = Math.max(1.5, v.s * 0.1);
  c.strokeStyle = it.kit.light ? it.kit.trim : it.kit.band || it.kit.trim;
  if (!it.home) c.setLineDash([v.s * 0.35, v.s * 0.25]);
  c.beginPath(); c.ellipse(X, Y, v.s * 1.05, v.s * 1.05 * v.K, 0, 0, TAU); c.stroke();
  c.restore();
}
function chevron(c, v, P, it) {
  const q = P(it.pl.x, it.pl.z, (it.pl.y || 0) + it.r.height / 12 + 0.7);
  const s = clamp(q.s, 14, 24), X = q.X, top = is3d() && v.W >= 760 ? Math.max(q.Y, 96 + s) : q.Y; // clear of the floating score bug
  c.fillStyle = '#FFD84D'; c.strokeStyle = '#14121F'; c.lineWidth = 2;
  c.beginPath(); c.moveTo(X - s * 0.5, top - s * 0.55); c.lineTo(X + s * 0.5, top - s * 0.55); c.lineTo(X, top); c.closePath(); c.fill(); c.stroke();
  const fs = Math.round(clamp(s * 0.6, 11, 18));
  c.font = `700 ${Math.round(fs * 1.12)}px "Barlow Condensed", system-ui, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'bottom';
  c.lineWidth = 3; c.strokeText('YOU', X, top - s * 0.6); c.fillStyle = '#FFD84D'; c.fillText('YOU', X, top - s * 0.6);
}

function hoopBack(c, v, side, venue) {
  const bxw = COURT.boardX[side], rx = COURT.rimX[side], dir = side ? -1 : 1;
  const padC = venue.home.colors.primary;
  // stanchion behind the baseline
  const px = side ? COURT.L + 4 : -4;
  c.fillStyle = '#2B2B30';
  c.fillRect(sx(v, px) - v.s * 0.35, sy(v, 25, 11.5), v.s * 0.7, sy(v, 25) - sy(v, 25, 11.5));
  c.fillStyle = padC; c.fillRect(sx(v, px) - v.s * 0.6, sy(v, 25, 6), v.s * 1.2, sy(v, 25) - sy(v, 25, 6));
  c.strokeStyle = '#2B2B30'; c.lineWidth = v.s * 0.35; c.beginPath(); c.moveTo(sx(v, px), sy(v, 25, 11.2)); c.lineTo(sx(v, bxw), sy(v, 25, 11.2)); c.stroke();
  // board seen edge-on, with a hint of glass
  const X = sx(v, bxw);
  c.fillStyle = 'rgba(210,235,245,0.55)'; c.fillRect(X - v.s * 0.18, sy(v, 25, COURT.boardY1) - v.s * 1.4, v.s * 0.36, (COURT.boardY1 - COURT.boardY0) * v.s + v.s * 1.4);
  c.strokeStyle = '#F4F1EA'; c.lineWidth = Math.max(1, v.s * 0.08); c.strokeRect(X - v.s * 0.18, sy(v, 25, COURT.boardY1) - v.s * 1.4, v.s * 0.36, (COURT.boardY1 - COURT.boardY0) * v.s + v.s * 1.4);
  // back half of the rim
  const shakeY = R.fx.rim[side] ? Math.sin(R.fx.rim[side] * 30) * v.s * 0.08 : 0;
  c.strokeStyle = '#D9561E'; c.lineWidth = Math.max(1.5, v.s * 0.12);
  c.beginPath(); c.ellipse(sx(v, rx), sy(v, 25, COURT.rimY) + shakeY, COURT.rimR * v.s, COURT.rimR * v.s * v.K, 0, Math.PI, TAU); c.stroke();
  c.beginPath(); c.moveTo(X, sy(v, 25, COURT.rimY)); c.lineTo(sx(v, rx - dir * COURT.rimR), sy(v, 25, COURT.rimY)); c.stroke();
}

function hoopFront(c, v, side) {
  const rx = COURT.rimX[side];
  const X = sx(v, rx), Y = sy(v, 25, COURT.rimY) + (R.fx.rim[side] ? Math.sin(R.fx.rim[side] * 30) * v.s * 0.08 : 0);
  const r = COURT.rimR * v.s;
  // net: a trapezoid of strings; it stretches after a swish
  const st = R.fx.net[side];
  const nb = v.s * (1.5 + st * 0.6), nw = r * (0.55 - st * 0.1);
  c.strokeStyle = 'rgba(250,250,250,0.85)'; c.lineWidth = 1;
  for (let k = 0; k <= 6; k++) {
    const f = k / 6;
    const x0 = X - r + f * 2 * r, x1 = X - nw + f * 2 * nw + Math.sin(st * 20 + k) * st * 2;
    c.beginPath(); c.moveTo(x0, Y); c.lineTo(x1, Y + nb); c.stroke();
  }
  for (let k = 1; k <= 3; k++) { const f = k / 3.4, w = r + (nw - r) * f; c.beginPath(); c.ellipse(X, Y + nb * f, w, w * v.K * 0.6, 0, 0, Math.PI); c.stroke(); }
  c.strokeStyle = '#E8642A'; c.lineWidth = Math.max(1.5, v.s * 0.12);
  c.beginPath(); c.ellipse(X, Y, r, r * v.K, 0, 0, Math.PI); c.stroke();
}

function drawBall(c, v, b) {
  const X = sx(v, b.x), Y = sy(v, b.z, b.y), r = Math.max(3, 0.45 * v.s);
  const g = c.createRadialGradient(X - r * 0.35, Y - r * 0.35, r * 0.1, X, Y, r);
  g.addColorStop(0, '#F08A4B'); g.addColorStop(1, '#B4501F');
  c.fillStyle = g; c.beginPath(); c.arc(X, Y, r, 0, TAU); c.fill();
  c.strokeStyle = 'rgba(40,20,10,0.75)'; c.lineWidth = Math.max(0.8, r * 0.12);
  const spin = (b.x + b.y) * 0.8;
  c.beginPath(); c.moveTo(X - r, Y); c.lineTo(X + r, Y); c.stroke();
  c.beginPath(); c.ellipse(X, Y, r * Math.abs(Math.cos(spin)), r, 0, 0, TAU); c.stroke();
}

// Shot meter: a vertical bar beside the shooter. Marker shape + text label, not color alone.
function drawMeter(c, v, P, mt) {
  const q = P(mt.x, mt.z, mt.y + mt.h + 0.4);
  const h = clamp(q.s * 4.6, 110, 170), w = clamp(q.s * 1.0, 22, 32);
  const X = clamp(q.X + Math.max(q.s * 1.4, 26), 8, v.W - w - 120), top = clamp(q.Y - h * 0.25, 12, v.H - h - 12);
  if (!mt.v && mt.label) { label(c, X, top + h * 0.35, mt.label, v, 'left'); return; } // after release: just the grade
  c.fillStyle = 'rgba(20,18,31,0.88)'; c.beginPath(); c.roundRect(X - 3, top - 3, w + 6, h + 6, 5); c.fill();
  c.strokeStyle = '#FFF6E0'; c.lineWidth = 1.5; c.stroke();
  const sweetY = top + h * (1 - SWEET / 1.18), bandH = h * (mt.win * 2 / 1.18);
  c.fillStyle = '#2E6A3C'; c.fillRect(X, sweetY - bandH * 1.5, w, bandH * 3);
  c.fillStyle = '#5FD38A'; c.fillRect(X, sweetY - bandH / 2, w, bandH);
  const f = clamp(mt.v / 1.18, 0, 1);
  c.fillStyle = 'rgba(255,216,77,0.92)'; c.fillRect(X + w * 0.2, top + h * (1 - f), w * 0.6, h * f);
  c.fillStyle = '#FFFFFF'; c.beginPath(); c.moveTo(X - 8, top + h * (1 - f)); c.lineTo(X - 1, top + h * (1 - f) - 6); c.lineTo(X - 1, top + h * (1 - f) + 6); c.closePath(); c.fill();
  if (mt.label) label(c, X + w + 8, top + h * 0.35, mt.label, v, 'left');
}

function drawFTMeter(c, v, P, ft) {
  const q = P(ft.x, ft.z, ft.y);
  const w = clamp(q.s * 7, 150, 260), h = clamp(q.s * 0.6, 16, 22);
  const X = clamp(q.X - w / 2, 8, v.W - w - 8), Y = clamp(q.Y - h - q.s * 0.6, 30, v.H - h - 8);
  c.fillStyle = 'rgba(20,18,31,0.88)'; c.fillRect(X - 3, Y - 3, w + 6, h + 6);
  const band = 0.08 * ft.scale;
  c.fillStyle = '#2E6A3C'; c.fillRect(X + w * (0.5 - band * 2.2), Y, w * band * 4.4, h);
  c.fillStyle = '#5FD38A'; c.fillRect(X + w * (0.5 - band), Y, w * band * 2, h);
  const mx = X + w * ft.mv;
  c.fillStyle = '#FFFFFF'; c.beginPath(); c.moveTo(mx, Y - 1); c.lineTo(mx - 6, Y - 9); c.lineTo(mx + 6, Y - 9); c.closePath(); c.fill();
  c.fillRect(mx - 1.5, Y, 3, h);
  const size = Math.round(clamp(q.s * 0.6, 13, 18));
  c.font = `700 ${Math.round(size * 1.12)}px "Barlow Condensed", system-ui, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'bottom';
  const txt = ft.label || `FREE THROW ${ft.n} OF ${ft.total}`;
  c.lineWidth = 4; c.strokeStyle = '#14121F'; c.strokeText(txt, X + w / 2, Y - 11); c.fillStyle = '#FFF6E0'; c.fillText(txt, X + w / 2, Y - 11);
}

function label(c, x, y, txt, v, align = 'center') {
  const size = Math.round(clamp(v.s * 1.15, 24, 38));
  c.font = `400 ${size}px "Bebas Neue", "Arial Black", Impact, sans-serif`; c.textAlign = align; c.textBaseline = 'middle';
  const w = c.measureText(txt).width, x0 = align === 'left' ? x - 6 : x - w / 2 - 6;
  c.fillStyle = 'rgba(14,12,22,0.86)'; c.beginPath(); c.roundRect(x0, y - size * 0.62, w + 12, size * 1.2, 5); c.fill();
  c.lineWidth = 4; c.strokeStyle = '#14121F'; c.strokeText(txt, x, y);
  c.fillStyle = txt === 'PERFECT' ? '#5FD38A' : txt === 'GOOD' ? '#FFF6E0' : '#FFB4A8'; c.fillText(txt, x, y);
}

function offscreenArrow(c, v, P, o) {
  const q = P(o.x, o.z, 3);
  const m = 18;
  if (q.X > 0 && q.X < v.W && q.Y > 0 && q.Y < v.H) return;
  const x = clamp(q.X, m, v.W - m), y = clamp(q.Y, m + 8, v.H - m);

// ---------------------------------------------------------------- loop

}

}

// ---------------------------------------------------------------- replays
// The last 4 s of play are kept as light snapshots. After a three, a dunk or a buzzer-beater the sim waits
// while a half-speed replay plays from a low baseline camera. Any button skips it. Replays never start from

}

    const d = fr.p[i];

  });

    while (k > 0 && rp.frames[k].b[3] !== 'held') k--;
    const h = rp.frames[k].b[4], sp = h >= 0 ? rp.frames[k].p[h] : [ball.x, ball.z];

// ---------------------------------------------------------------- events → sound, effects, announcements

      if (x.teamFouls) { const qi = Math.min(m.clock.q, 4) - 1; m.teams[0].tf[qi] = x.teamFouls[0]; m.teams[1].tf[qi] = x.teamFouls[1]; }
