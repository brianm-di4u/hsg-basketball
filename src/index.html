<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spa City Hoops</title>
<meta name="description" content="An original arcade high-school basketball game set in Garland County, Arkansas, with fictional players. Part of the open-source Hot Springs Games collection (MIT).">
<link rel="stylesheet" href="styles/main.css">
</head>
<body class="theme-dark">
<div id="app">
  <header id="sb" aria-label="Scoreboard" hidden></header>
  <div id="stage">
    <canvas id="cv" role="img" aria-label="Basketball court. Scores and game events are announced in text."></canvas>
    <div id="coach" hidden><div id="coach-tip" data-act="tapTip" aria-hidden="true"><i class="coach-dot"></i><span id="coach-t"></span></div><button id="coach-skip" type="button" data-act="skipTips">Skip tips</button></div>
    <button id="b-pause" class="iconbtn" aria-label="Pause (P)" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg></button>
    <button id="b-mute" class="iconbtn" aria-label="Sound (M)" aria-pressed="true" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9.5h4L12 5v14l-5-4.5H3z" fill="currentColor"/><path class="on" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="off" d="M16 9.5l5 5M21 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
  </div>
  <div id="pad" hidden>
    <div id="stick" aria-label="Movement stick" role="application"><div id="knob"></div></div>
    <div class="pbtns">
      <button id="b-sprint" class="pb small" aria-label="Sprint (hold)">SPRINT</button>
      <button id="b-switch" class="pb small" aria-label="Switch defender">SWITCH</button>
      <button id="b-pass" class="pb" aria-label="Pass or steal">PASS<small>STEAL</small></button>
      <button id="b-shoot" class="pb big" aria-label="Shoot, jump or block (hold and release)">SHOOT<small>JUMP</small></button>
    </div>
  </div>
</div>
<main id="screen" aria-live="off"></main>
<div id="live" class="sr-only" aria-live="polite"></div>
<div id="toast" aria-hidden="true" hidden></div>
<!-- @inline ../shared/data/schools.json as SCHOOLS -->
<!-- @inline ../data/facts.json as FACTS -->
<script type="module" src="js/main.js"></script>
</body>
</html>
